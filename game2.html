<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>🧱 ทุบอิฐ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0d0618;color:#f0e9ff;display:grid;place-items:center;min-height:100vh;padding:10px}
.app{width:100%;max-width:380px;background:#1a0f2e;border:1px solid #3b2a5c;border-radius:20px;padding:14px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.bar h1{flex:1;font-size:16px;color:#f472b6}
.coin{background:#3a2c07;color:#fbbf24;border:1px solid #6b5210;padding:6px 12px;border-radius:99px;font-weight:800;font-size:14px}
.pg{display:none}.pg.on{display:block}
.card{background:#120a22;border:1px solid #3b2a5c;border-radius:14px;padding:16px;text-align:center}
.big{font-size:30px;font-weight:900;color:#fbbf24}
.mut{font-size:12px;color:#b3a3cf;line-height:1.7}
button{border:0;cursor:pointer;font-family:inherit}
.btn{width:100%;padding:13px;border-radius:13px;font-size:15px;font-weight:800;color:#fff;background:#a855f7;margin-top:8px}
.btn.g{background:#16a34a}.btn.o{background:#d97706}.btn.d{background:#2a1c45;color:#cbd5e1}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hud{display:flex;gap:6px;margin:10px 0}
.hud div{flex:1;background:#120a22;border:1px solid #3b2a5c;border-radius:11px;padding:7px;text-align:center;font-size:10px;color:#b3a3cf}
.hud b{display:block;font-size:15px;color:#f0e9ff}
canvas{width:100%;display:block;border-radius:14px;border:1px solid #3b2a5c;background:#0b0518;touch-action:none}
.item{display:flex;gap:10px;align-items:center;background:#120a22;border:1px solid #3b2a5c;border-radius:13px;padding:10px;margin-bottom:8px}
.item .ic{font-size:22px}.item .tx{flex:1}.item b{font-size:13px}.item p{font-size:11px;color:#b3a3cf}
.item button{padding:9px 12px;border-radius:10px;background:#f59e0b;color:#2b1a00;font-weight:800;font-size:12px}
.item button:disabled{background:#2a1c45;color:#6b5a8a}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#241539;border:1px solid #4c356f;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
</style></head><body>
<div class="app">
<div class="bar"><h1>🧱 ทุบอิฐ</h1><div class="coin">🪙 <span id="cn">0</span></div></div>

<div id="menu" class="pg on">
 <div class="card"><div style="font-size:52px">🧱</div><div class="big" id="bs">1</div>
 <div class="mut">ด่านสูงสุด</div></div>
 <p class="mut" style="margin-top:10px">🌟 อิฐทองให้เหรียญพิเศษ · ทุบทุกก้อนได้ 1🪙<br>
 ไอเทม: ➕ แป้นยาว · ⚡ มัลติบอล · ❤️ ชีวิต · 💰 เหรียญ</p>
 <button class="btn g" onclick="start()">▶ เริ่มเล่น</button>
 <button class="btn o" onclick="openShop()">🛒 ร้านค้า</button>
</div>

<div id="shop" class="pg"><div id="ups"></div>
 <button class="btn d" onclick="show('menu')">← กลับ</button></div>

<div id="game" class="pg">
 <canvas id="cv" width="320" height="440"></canvas>
 <div class="hud"><div>คะแนน<b id="hs">0</b></div><div>ด่าน<b id="hl">1</b></div>
 <div>เหรียญ<b id="hg">0</b></div><div>ชีวิต<b id="hh">❤❤❤</b></div></div>
 <p class="mut" style="text-align:center">ลากนิ้ว / เลื่อนเมาส์ บนจอเพื่อบังคับแป้น</p>
 <button class="btn d" onclick="quit()">🏠 ออก</button>
</div>

<div id="over" class="pg">
 <div class="card"><div style="font-size:44px">💀</div><div class="big" id="os">0</div>
 <div class="mut" id="ob"></div><div style="margin-top:8px;color:#fbbf24;font-weight:800" id="oc"></div></div>
 <button class="btn g" onclick="start()">🔄 เล่นอีกครั้ง</button>
 <div class="row"><button class="btn o" onclick="openShop()">🛒 ร้านค้า</button>
 <button class="btn d" onclick="show('menu')">🏠 เมนู</button></div>
</div>
</div><div class="toast" id="tst"></div>
<script>
const K='brk_',$=i=>document.getElementById(i);
const LD=(k,d)=>{try{const v=localStorage.getItem(K+k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const ST=(k,v)=>{try{localStorage.setItem(K+k,JSON.stringify(v))}catch(e){}};
let coin=LD('coin',0),up=LD('up',{pw:0,lf:0,dr:0,mu:0}),bl=LD('best',1);
let AC;function beep(f,d,t){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
 if(AC.state=='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();
 o.type=t||'square';o.frequency.value=f;g.gain.setValueAtTime(.1,AC.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
 o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function paint(){$('cn').textContent=coin;$('bs').textContent=bl;
 document.querySelectorAll('[data-c]').forEach(b=>b.disabled=coin<+b.dataset.c)}
function toast(m){const t=$('tst');t.textContent=m;t.classList.add('on');
 clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('on'),1400)}
function show(id){document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));$(id).classList.add('on');paint()}
const UPS=[{k:'pw',i:'📏',n:'แป้นยาวขึ้น',d:'+8px ต่อระดับ',max:5,c:l=>80+l*80},
{k:'lf',i:'❤️',n:'ชีวิตเริ่มต้น',d:'+1 ชีวิต',max:4,c:l=>180+l*180},
{k:'dr',i:'🎁',n:'โชคไอเทม',d:'ไอเทมตกบ่อยขึ้น',max:4,c:l=>120+l*120},
{k:'mu',i:'💰',n:'ตัวคูณเหรียญ',d:'รับเหรียญ +25% ต่อระดับ',max:4,c:l=>150+l*140}];
function openShop(){show('shop');renderShop()}
function renderShop(){const b=$('ups');b.innerHTML='';
 UPS.forEach(o=>{const l=up[o.k]|0,mx=l>=o.max,c=o.c(l);
  const d=document.createElement('div');d.className='item';
  d.innerHTML='<div class="ic">'+o.i+'</div><div class="tx"><b>'+o.n+
   ' <span style="color:#fbbf24">Lv'+l+'/'+o.max+'</span></b><p>'+o.d+'</p></div>';
  const t=document.createElement('button');t.textContent=mx?'MAX':'🪙 '+c;
  if(mx)t.disabled=true;else{t.dataset.c=c;t.onclick=()=>{
   if(coin<c){beep(150,.2,'sawtooth');return toast('เหรียญไม่พอ')}
   coin-=c;up[o.k]=l+1;ST('coin',coin);ST('up',up);beep(900,.12,'triangle');renderShop()}}
  d.appendChild(t);b.appendChild(d)});paint()}

const cv=$('cv'),X=cv.getContext('2d'),W=320,H=440;
let px,pw,wide,balls,bricks,drops,score,gain=0,lives,level,alive=false,last,raf;
function addCoin(n){if(n<=0)return;coin+=n;gain+=n;ST('coin',coin);paint()}
function PW(){return pw+(wide>0?32:0)}
function mkLevel(){bricks=[];const rows=Math.min(7,2+level),cols=6,bw=46,bh=16;
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
  if(level>2&&Math.random()<.12)continue;
  const gold=Math.random()<.12;
  bricks.push({x:14+c*(bw+3),y:52+r*(bh+5),w:bw,h:bh,
   hp:gold?1:Math.min(3,1+(Math.random()*level/2|0)),g:gold})}}
function ball(x,y,vx,vy){return{x,y,vx,vy}}
function start(){beep(600,.08,'triangle');
 level=1;score=0;gain=0;lives=3+up.lf;pw=62+up.pw*8;wide=0;drops=[];
 px=W/2-pw/2;mkLevel();balls=[ball(W/2,H-46,3,-4.2)];alive=true;
 show('game');hud();last=performance.now();
 cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function quit(){alive=false;cancelAnimationFrame(raf);show('menu')}
function hud(){$('hs').textContent=score;$('hl').textContent=level;
 $('hg').textContent=gain;$('hh').textContent='❤'.repeat(Math.max(0,lives))||'💀'}
function hit(i){const k=bricks[i];k.hp--;beep(300+k.hp*150,.05);
 if(k.hp>0)return;
 score+=10*(k.g?3:1);
 addCoin(Math.round((k.g?4:1)*(1+up.mu*.25)));
 if(Math.random()<.12+up.dr*.05){const T=['➕','⚡','❤️','💰'];
  drops.push({x:k.x+k.w/2,y:k.y,t:T[Math.random()*4|0]})}
 bricks.splice(i,1)}
function grab(t){beep(1100,.12,'triangle');
 if(t=='➕'){wide=12000;toast('➕ แป้นยาวขึ้น')}
 else if(t=='⚡'){const b=balls[0];if(b)for(let i=0;i<2;i++)
   balls.push(ball(b.x,b.y,(Math.random()-.5)*7,-4.5));toast('⚡ มัลติบอล!')}
 else if(t=='❤️'){lives++;toast('❤️ ชีวิต +1')}
 else{score+=50;addCoin(Math.round(10*(1+up.mu*.25)));toast('💰 เหรียญโบนัส!')}}
function loop(t){if(!alive)return;const dt=Math.min(40,t-last);last=t;const f=dt/16.7;
 wide=Math.max(0,wide-dt);const W2=PW();px=Math.max(0,Math.min(W-W2,px));
 balls.forEach(b=>{b.x+=b.vx*f;b.y+=b.vy*f;
  if(b.x<6){b.x=6;b.vx=Math.abs(b.vx);beep(400,.03)}
  if(b.x>W-6){b.x=W-6;b.vx=-Math.abs(b.vx);beep(400,.03)}
  if(b.y<6){b.y=6;b.vy=Math.abs(b.vy);beep(400,.03)}
  if(b.y>H-28&&b.y<H-12&&b.vy>0&&b.x>px-5&&b.x<px+W2+5){
   b.vy=-Math.abs(b.vy);b.vx+=(b.x-(px+W2/2))/15;
   const s=Math.hypot(b.vx,b.vy);
   if(s>8.5){b.vx*=8.5/s;b.vy*=8.5/s}if(s<3.2){b.vx*=1.3;b.vy*=1.3}
   beep(620,.05,'triangle')}
  for(let i=bricks.length-1;i>=0;i--){const k=bricks[i];
   if(b.x>k.x-6&&b.x<k.x+k.w+6&&b.y>k.y-6&&b.y<k.y+k.h+6){
    const ox=Math.min(b.x+6-k.x,k.x+k.w-(b.x-6)),oy=Math.min(b.y+6-k.y,k.y+k.h-(b.y-6));
    if(ox<oy)b.vx=-b.vx;else b.vy=-b.vy;hit(i);break}}});
 balls=balls.filter(b=>b.y<H+30);
 if(!balls.length){lives--;beep(180,.3,'sawtooth');
  if(lives<0)return over();
  balls=[ball(px+W2/2,H-46,3*(Math.random()>.5?1:-1),-4.2)]}
 drops.forEach(d=>{d.y+=2.6*f;
  if(d.y>H-32&&d.y<H-6&&d.x>px-8&&d.x<px+W2+8){d.dead=1;grab(d.t)}});
 drops=drops.filter(d=>!d.dead&&d.y<H+20);
 if(!bricks.length){level++;beep(1300,.3,'triangle');
  addCoin(Math.round(level*5*(1+up.mu*.25)));toast('🎉 ผ่านด่าน '+(level-1));
  if(level>bl){bl=level;ST('best',bl)}
  mkLevel();balls=[ball(W/2,H-46,3,-4.2)]}
 draw(W2);hud();raf=requestAnimationFrame(loop)}
function over(){alive=false;cancelAnimationFrame(raf);beep(140,.45,'sawtooth');
 addCoin(Math.round(score/45*(1+up.mu*.25)));
 $('os').textContent=score;
 $('ob').textContent='ไปถึงด่าน '+level+' · ด่านสูงสุด '+bl;
 $('oc').textContent='ได้รับ +'+gain+' 🪙';show('over')}
function rr(x,y,w,h,r){if(X.roundRect){X.beginPath();X.roundRect(x,y,w,h,r);X.fill()}else X.fillRect(x,y,w,h)}
function draw(W2){X.fillStyle='#0b0518';X.fillRect(0,0,W,H);
 bricks.forEach(k=>{X.fillStyle=k.g?'#fbbf24':['#22d3ee','#a78bfa','#f472b6'][Math.min(2,k.hp-1)];
  rr(k.x,k.y,k.w,k.h,5);
  X.fillStyle='rgba(255,255,255,.25)';X.fillRect(k.x+3,k.y+3,k.w-6,3)});
 X.fillStyle='#f472b6';rr(px,H-28,W2,12,6);
 X.fillStyle='#fbbf24';balls.forEach(b=>{X.beginPath();X.arc(b.x,b.y,6,0,7);X.fill()});
 X.font='17px serif';X.textAlign='center';X.textBaseline='middle';
 drops.forEach(d=>X.fillText(d.t,d.x,d.y));
 X.fillStyle='#fff';X.font='900 12px system-ui';X.textAlign='left';X.fillText('ด่าน '+level,10,20);
 X.textAlign='right';X.fillText(score+' คะแนน',W-10,20)}
function setX(cx){const r=cv.getBoundingClientRect(),w=PW();
 px=Math.max(0,Math.min(W-w,(cx-r.left)*(W/r.width)-w/2))}
cv.addEventListener('mousemove',e=>{if(alive)setX(e.clientX)});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(alive)setX(e.touches[0].clientX)},{passive:false});
cv.addEventListener('touchstart',e=>{if(alive)setX(e.touches[0].clientX)},{passive:true});
addEventListener('keydown',e=>{if(!alive)return;
 if(e.key=='ArrowLeft')px-=26;if(e.key=='ArrowRight')px+=26});
paint();
</script></body></html>
