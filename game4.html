<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>🚀 ยิงยานอวกาศ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#030713;color:#e6f4ff;display:grid;place-items:center;min-height:100vh;padding:10px}
.app{width:100%;max-width:380px;background:#08142a;border:1px solid #16305a;border-radius:20px;padding:14px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.bar h1{flex:1;font-size:16px;color:#22d3ee}
.coin{background:#3a2c07;color:#fbbf24;border:1px solid #6b5210;padding:6px 12px;border-radius:99px;font-weight:800;font-size:14px}
.pg{display:none}.pg.on{display:block}
.card{background:#050f22;border:1px solid #16305a;border-radius:14px;padding:16px;text-align:center}
.big{font-size:30px;font-weight:900;color:#fbbf24}
.mut{font-size:12px;color:#8fa9c8;line-height:1.7}
button{border:0;cursor:pointer;font-family:inherit}
.btn{width:100%;padding:13px;border-radius:13px;font-size:15px;font-weight:800;color:#fff;background:#0891b2;margin-top:8px}
.btn.g{background:#16a34a}.btn.o{background:#d97706}.btn.d{background:#122a4a;color:#cbd5e1}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hud{display:flex;gap:6px;margin:10px 0}
.hud div{flex:1;background:#050f22;border:1px solid #16305a;border-radius:11px;padding:7px;text-align:center;font-size:10px;color:#8fa9c8}
.hud b{display:block;font-size:15px;color:#e6f4ff}
canvas{width:100%;display:block;border-radius:14px;border:1px solid #16305a;background:#000;touch-action:none}
.item{display:flex;gap:10px;align-items:center;background:#050f22;border:1px solid #16305a;border-radius:13px;padding:10px;margin-bottom:8px}
.item .ic{font-size:22px}.item .tx{flex:1}.item b{font-size:13px}.item p{font-size:11px;color:#8fa9c8}
.item button{padding:9px 12px;border-radius:10px;background:#f59e0b;color:#2b1a00;font-weight:800;font-size:12px}
.item button:disabled{background:#122a4a;color:#5b7398}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0c2545;border:1px solid #1d4373;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
</style></head><body>
<div class="app">
<div class="bar"><h1>🚀 ยิงยานอวกาศ</h1><div class="coin">🪙 <span id="cn">0</span></div></div>

<div id="menu" class="pg on">
 <div class="card"><div style="font-size:52px">🚀</div><div class="big" id="bs">0</div>
 <div class="mut">คะแนนสูงสุด</div></div>
 <p class="mut" style="margin-top:10px">👾 ธรรมดา +1🪙 · 🛸 ยิงสวน +2🪙 · 💠 หุ้มเกราะ +3🪙<br>
 ไอเทม: ⚡ อัปปืน · 🛡️ โล่ · ❤️ ชีวิต · 💰 เหรียญ</p>
 <button class="btn g" onclick="start()">▶ ออกบิน</button>
 <button class="btn o" onclick="openShop()">🛒 อู่ซ่อม</button>
</div>

<div id="shop" class="pg"><div id="ups"></div>
 <button class="btn d" onclick="show('menu')">← กลับ</button></div>

<div id="game" class="pg">
 <canvas id="cv" width="320" height="440"></canvas>
 <div class="hud"><div>คะแนน<b id="hs">0</b></div><div>เหรียญ<b id="hg">0</b></div>
 <div>ปืน<b id="hw">1</b></div><div>ชีวิต<b id="hh">❤❤❤</b></div></div>
 <p class="mut" style="text-align:center">ลากนิ้วบนจอเพื่อบังคับยาน (ยิงอัตโนมัติ)</p>
 <button class="btn d" onclick="quit()">🏠 ออก</button>
</div>

<div id="over" class="pg">
 <div class="card"><div style="font-size:44px">💥</div><div class="big" id="os">0</div>
 <div class="mut" id="ob"></div><div style="margin-top:8px;color:#fbbf24;font-weight:800" id="oc"></div></div>
 <button class="btn g" onclick="start()">🔄 บินอีกครั้ง</button>
 <div class="row"><button class="btn o" onclick="openShop()">🛒 อู่ซ่อม</button>
 <button class="btn d" onclick="show('menu')">🏠 เมนู</button></div>
</div>
</div><div class="toast" id="tst"></div>
<script>
const K='spc_',$=i=>document.getElementById(i);
const LD=(k,d)=>{try{const v=localStorage.getItem(K+k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const ST=(k,v)=>{try{localStorage.setItem(K+k,JSON.stringify(v))}catch(e){}};
let coin=LD('coin',0),up=LD('up',{gu:0,lf:0,rt:0,mu:0}),best=LD('best',0);
let AC;function beep(f,d,t,v){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
 if(AC.state=='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();
 o.type=t||'square';o.frequency.value=f;g.gain.setValueAtTime(v||.08,AC.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
 o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function paint(){$('cn').textContent=coin;$('bs').textContent=best;
 document.querySelectorAll('[data-c]').forEach(b=>b.disabled=coin<+b.dataset.c)}
function toast(m){const t=$('tst');t.textContent=m;t.classList.add('on');
 clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('on'),1400)}
function show(id){document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));$(id).classList.add('on');paint()}
const UPS=[{k:'gu',i:'🔫',n:'ปืนเริ่มต้น',d:'เริ่มเกมด้วยปืนแรงขึ้น',max:3,c:l=>180+l*200},
{k:'rt',i:'⚡',n:'อัตรายิง',d:'ยิงถี่ขึ้น 12% ต่อระดับ',max:4,c:l=>120+l*130},
{k:'lf',i:'❤️',n:'เกราะยาน',d:'+1 ชีวิตเริ่มต้น',max:4,c:l=>190+l*200},
{k:'mu',i:'💰',n:'ตัวคูณเหรียญ',d:'รับเหรียญ +25% ต่อระดับ',max:4,c:l=>150+l*140}];
function openShop(){show('shop');renderShop()}
function renderShop(){const b=$('ups');b.innerHTML='';
 UPS.forEach(o=>{const l=up[o.k]|0,mx=l>=o.max,c=o.c(l);
  const d=document.createElement('div');d.className='item';
  d.innerHTML='<div class="ic">'+o.i+'</div><div class="tx"><b>'+o.n+
   ' <span style="color:#fbbf24">Lv'+l+'/'+o.max+'</span></b><p>'+o.d+'</p></div>';
  const t=document.createElement('button');t.textContent=mx?'MAX':'🪙 '+c;
  if(mx)t.disabled=true;else{t.dataset.c=c;t.onclick=()=>{
   if(coin<c){beep(150,.2,'sawtooth');return toast('เหรียญไม่พอ')}
   coin-=c;up[o.k]=l+1;ST('coin',coin);ST('up',up);beep(900,.12,'triangle');renderShop()}}
  d.appendChild(t);b.appendChild(d)});paint()}

const cv=$('cv'),X=cv.getContext('2d'),W=320,H=440;
let sx,bul,ebul,ens,drops,stars,score,gain=0,lives,gun,shield,fireT,spawnT,alive=false,last,raf;
stars=[];for(let i=0;i<50;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.6+.4});
function addCoin(n){if(n<=0)return;coin+=n;gain+=n;ST('coin',coin);paint()}
function start(){beep(600,.1,'triangle');
 sx=W/2;bul=[];ebul=[];ens=[];drops=[];score=0;gain=0;
 lives=3+up.lf;gun=1+up.gu;shield=0;fireT=0;spawnT=0;alive=true;
 show('game');hud();last=performance.now();
 cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function quit(){alive=false;cancelAnimationFrame(raf);show('menu')}
function hud(){$('hs').textContent=score;$('hg').textContent=gain;
 $('hw').textContent=gun;$('hh').textContent='❤'.repeat(Math.max(0,lives))+(shield>0?' 🛡':'')}
function fire(){const y=H-48;
 if(gun<=1)bul.push({x:sx,y,vx:0});
 else if(gun==2){bul.push({x:sx-8,y,vx:0});bul.push({x:sx+8,y,vx:0})}
 else if(gun==3){bul.push({x:sx,y,vx:0});bul.push({x:sx-10,y,vx:-1.6});bul.push({x:sx+10,y,vx:1.6})}
 else{bul.push({x:sx,y,vx:0});bul.push({x:sx-9,y,vx:-1.2});bul.push({x:sx+9,y,vx:1.2});
  bul.push({x:sx-16,y,vx:-3});bul.push({x:sx+16,y,vx:3})}
 beep(1200,.03,'square',.03)}
function loop(t){if(!alive)return;const dt=Math.min(40,t-last);last=t;const f=dt/16.7;
 fireT-=dt;if(fireT<=0){fireT=Math.max(100,250-up.rt*25);fire()}
 stars.forEach(s=>{s.y+=s.s*f;if(s.y>H){s.y=0;s.x=Math.random()*W}});
 spawnT-=dt;
 if(spawnT<=0){spawnT=Math.max(280,750-score/4);
  const r=Math.random(),ty=r<.6?0:r<.85?1:2;
  ens.push({x:24+Math.random()*(W-48),y:-22,t:ty,
   hp:ty==2?4:ty==1?2:1,sc:ty==2?40:ty==1?25:10,ph:Math.random()*7,ct:900})}
 bul.forEach(b=>{b.y-=8.5*f;b.x+=b.vx*f});
 bul=bul.filter(b=>b.y>-12);
 ebul.forEach(b=>{b.x+=b.vx*f;b.y+=b.vy*f});
 ebul=ebul.filter(b=>b.y<H+12&&b.y>-12);
 ens.forEach(e=>{e.ph+=.05*f;e.y+=(e.t==2?1:e.t==1?1.5:1.9)*f;
  if(e.t!=2)e.x+=Math.sin(e.ph)*1.6*f;
  e.x=Math.max(18,Math.min(W-18,e.x));
  if(e.t>=1){e.ct-=dt;if(e.ct<=0){e.ct=1100+Math.random()*700;
   const a=Math.atan2(H-46-e.y,sx-e.x);
   ebul.push({x:e.x,y:e.y+12,vx:Math.cos(a)*3,vy:Math.sin(a)*3})}}
  if(e.y>H+20){e.dead=1;lives--;beep(200,.2,'sawtooth');if(lives<0)over()}});
 bul.forEach(b=>ens.forEach(e=>{
  if(!e.dead&&Math.abs(e.x-b.x)<17&&Math.abs(e.y-b.y)<18){b.dead=1;e.hp--;beep(500,.04);
   if(e.hp<=0){e.dead=1;score+=e.sc;beep(320,.1,'sawtooth');
    addCoin(Math.round((e.t==2?3:e.t==1?2:1)*(1+up.mu*.25)));
    if(Math.random()<.16){const T=['⚡','🛡️','❤️','💰'];
     drops.push({x:e.x,y:e.y,t:T[Math.random()*4|0]})}}}}));
 bul=bul.filter(b=>!b.dead);ens=ens.filter(e=>!e.dead);
 ebul.forEach(b=>{if(Math.abs(b.x-sx)<13&&Math.abs(b.y-(H-46))<16){b.dead=1;dmg()}});
 ebul=ebul.filter(b=>!b.dead);
 ens.forEach(e=>{if(Math.abs(e.x-sx)<20&&Math.abs(e.y-(H-46))<20){e.dead=1;dmg()}});
 ens=ens.filter(e=>!e.dead);
 drops.forEach(d=>{d.y+=2*f;
  if(Math.abs(d.x-sx)<22&&Math.abs(d.y-(H-46))<24){d.dead=1;grab(d.t)}});
 drops=drops.filter(d=>!d.dead&&d.y<H+20);
 draw();hud();raf=requestAnimationFrame(loop)}
function dmg(){if(shield>0){shield--;beep(300,.15,'triangle');return}
 lives--;beep(180,.3,'sawtooth');if(lives<0)over()}
function grab(t){beep(1100,.12,'triangle');
 if(t=='⚡'){gun=Math.min(4,gun+1);toast('⚡ อัปปืน Lv'+gun)}
 else if(t=='🛡️'){shield=Math.min(3,shield+1);toast('🛡️ ได้โล่')}
 else if(t=='❤️'){lives++;toast('❤️ ชีวิต +1')}
 else{score+=60;addCoin(Math.round(12*(1+up.mu*.25)));toast('💰 เหรียญโบนัส!')}}
function over(){alive=false;cancelAnimationFrame(raf);beep(140,.45,'sawtooth');
 addCoin(Math.round(score/50*(1+up.mu*.25)));
 const nb=score>best;if(nb){best=score;ST('best',best)}
 $('os').textContent=score;
 $('ob').textContent='สถิติสูงสุด '+best;
 $('oc').textContent='ได้รับ +'+gain+' 🪙';show('over')}
function draw(){X.fillStyle='#000';X.fillRect(0,0,W,H);
 stars.forEach(s=>{X.fillStyle='rgba(147,197,253,.7)';X.fillRect(s.x,s.y,s.s,s.s*2)});
 X.font='23px serif';X.textAlign='center';X.textBaseline='middle';
 ens.forEach(e=>X.fillText(e.t==0?'👾':e.t==1?'🛸':'💠',e.x,e.y));
 X.fillStyle='#fde047';bul.forEach(b=>X.fillRect(b.x-2,b.y,4,11));
 X.fillStyle='#f472b6';ebul.forEach(b=>{X.beginPath();X.arc(b.x,b.y,4,0,7);X.fill()});
 X.font='18px serif';drops.forEach(d=>X.fillText(d.t,d.x,d.y));
 X.font='29px serif';X.fillText('🚀',sx,H-46);
 if(shield>0){X.strokeStyle='#22d3ee';X.lineWidth=2.5;
  X.beginPath();X.arc(sx,H-46,24,0,7);X.stroke()}
 X.fillStyle='#fff';X.font='900 13px system-ui';X.textAlign='left';X.fillText(score+' คะแนน',10,22)}
function setX(cx){const r=cv.getBoundingClientRect();
 sx=Math.max(18,Math.min(W-18,(cx-r.left)*(W/r.width)))}
cv.addEventListener('mousemove',e=>{if(alive)setX(e.clientX)});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(alive)setX(e.touches[0].clientX)},{passive:false});
cv.addEventListener('touchstart',e=>{if(alive)setX(e.touches[0].clientX)},{passive:true});
addEventListener('keydown',e=>{if(!alive)return;
 if(e.key=='ArrowLeft')sx=Math.max(18,sx-26);if(e.key=='ArrowRight')sx=Math.min(W-18,sx+26)});
paint();
</script></body></html>
