<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>🐍 งูนีออน</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0a0e1a;color:#e8eefc;display:grid;place-items:center;min-height:100vh;padding:10px}
.app{width:100%;max-width:400px;background:#111a2e;border:1px solid #223052;border-radius:20px;padding:14px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.bar h1{flex:1;font-size:16px;color:#4ade80}
.coin{background:#3a2c07;color:#fbbf24;border:1px solid #6b5210;padding:6px 12px;border-radius:99px;font-weight:800;font-size:14px}
.pg{display:none}.pg.on{display:block}
.card{background:#0c1426;border:1px solid #223052;border-radius:14px;padding:16px;text-align:center}
.big{font-size:30px;font-weight:900;color:#fbbf24}
.mut{font-size:12px;color:#93a4c4;line-height:1.7}
button{border:0;cursor:pointer;font-family:inherit}
.btn{width:100%;padding:13px;border-radius:13px;font-size:15px;font-weight:800;color:#fff;background:#2563eb;margin-top:8px}
.btn.g{background:#16a34a}.btn.o{background:#d97706}.btn.d{background:#1e293b;color:#cbd5e1}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hud{display:flex;gap:6px;margin:10px 0}
.hud div{flex:1;background:#0c1426;border:1px solid #223052;border-radius:11px;padding:7px;text-align:center;font-size:10px;color:#93a4c4}
.hud b{display:block;font-size:15px;color:#e8eefc}
canvas{width:100%;display:block;border-radius:14px;border:1px solid #223052;background:#060a14;touch-action:none}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}
.pad button{padding:14px 0;font-size:18px;border-radius:12px;background:#1b2542;color:#4ade80}
.item{display:flex;gap:10px;align-items:center;background:#0c1426;border:1px solid #223052;border-radius:13px;padding:10px;margin-bottom:8px}
.item .ic{font-size:22px}.item .tx{flex:1}.item b{font-size:13px}.item p{font-size:11px;color:#93a4c4}
.item button{padding:9px 12px;border-radius:10px;background:#f59e0b;color:#2b1a00;font-weight:800;font-size:12px}
.item button:disabled{background:#1b2338;color:#5b6b8a}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#16203a;border:1px solid #2c3a5f;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
</style></head><body>
<div class="app">
<div class="bar"><h1>🐍 งูนีออน</h1><div class="coin">🪙 <span id="cn">0</span></div></div>

<div id="menu" class="pg on">
 <div class="card"><div style="font-size:52px">🐍</div><div class="big" id="bs">0</div>
 <div class="mut">สถิติสูงสุด</div></div>
 <p class="mut" style="margin-top:10px">🍎 +10 &amp; 1🪙 · 🍊 ทอง +30 &amp; 5🪙<br>
 🛡️ เกราะ · ⭐ คะแนน x2 · 🧲 ดูดอาหาร · กินเร็วได้คอมโบ</p>
 <button class="btn g" onclick="start()">▶ เริ่มเล่น</button>
 <button class="btn o" onclick="openShop()">🛒 ร้านค้า</button>
</div>

<div id="shop" class="pg"><div id="ups"></div>
 <button class="btn d" onclick="show('menu')">← กลับ</button></div>

<div id="game" class="pg">
 <canvas id="cv" width="400" height="400"></canvas>
 <div class="hud"><div>คะแนน<b id="hs">0</b></div><div>เหรียญ<b id="hg">0</b></div>
 <div>เกราะ<b id="hp">0</b></div><div>คอมโบ<b id="hc">x1</b></div></div>
 <div class="pad"><span></span><button onclick="turn(0,-1)">▲</button><span></span>
 <button onclick="turn(-1,0)">◀</button><button onclick="turn(0,1)">▼</button><button onclick="turn(1,0)">▶</button></div>
 <button class="btn d" onclick="quit()">🏠 ออก</button>
</div>

<div id="over" class="pg">
 <div class="card"><div style="font-size:44px" id="oe">💀</div><div class="big" id="os">0</div>
 <div class="mut" id="ob"></div><div style="margin-top:8px;color:#fbbf24;font-weight:800" id="oc"></div></div>
 <button class="btn g" onclick="start()">🔄 เล่นอีกครั้ง</button>
 <div class="row"><button class="btn o" onclick="openShop()">🛒 ร้านค้า</button>
 <button class="btn d" onclick="show('menu')">🏠 เมนู</button></div>
</div>
</div><div class="toast" id="tst"></div>
<script>
const K='snk_',$=i=>document.getElementById(i);
const LD=(k,d)=>{try{const v=localStorage.getItem(K+k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const ST=(k,v)=>{try{localStorage.setItem(K+k,JSON.stringify(v))}catch(e){}};
let coin=LD('coin',0),up=LD('up',{sh:0,sl:0,lk:0,mu:0}),best=LD('best',0);
let AC;function beep(f,d,t){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
 if(AC.state=='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();
 o.type=t||'square';o.frequency.value=f;g.gain.setValueAtTime(.1,AC.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
 o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function paint(){$('cn').textContent=coin;$('bs').textContent=best;
 document.querySelectorAll('[data-c]').forEach(b=>b.disabled=coin<+b.dataset.c)}
function toast(m){const t=$('tst');t.textContent=m;t.classList.add('on');
 clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('on'),1400)}
function show(id){document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));$(id).classList.add('on');paint()}
const UPS=[{k:'sh',i:'🛡️',n:'เกราะเริ่มเกม',d:'ชนแล้วไม่ตาย 1 ครั้ง',max:3,c:l=>100+l*120},
{k:'sl',i:'🐢',n:'ควบคุมง่าย',d:'งูเริ่มต้นช้าลง',max:3,c:l=>110+l*120},
{k:'lk',i:'🍀',n:'โชคของหายาก',d:'ผลไม้ทอง/ไอเทมโผล่บ่อยขึ้น',max:3,c:l=>130+l*140},
{k:'mu',i:'💰',n:'ตัวคูณเหรียญ',d:'รับเหรียญ +25% ต่อระดับ',max:4,c:l=>150+l*140}];
function openShop(){show('shop');renderShop()}
function renderShop(){const b=$('ups');b.innerHTML='';
 UPS.forEach(o=>{const l=up[o.k]|0,mx=l>=o.max,c=o.c(l);
  const d=document.createElement('div');d.className='item';
  d.innerHTML='<div class="ic">'+o.i+'</div><div class="tx"><b>'+o.n+
   ' <span style="color:#fbbf24">Lv'+l+'/'+o.max+'</span></b><p>'+o.d+'</p></div>';
  const t=document.createElement('button');t.textContent=mx?'MAX':'🪙 '+c;
  if(mx)t.disabled=true;else{t.dataset.c=c;t.onclick=()=>{
   if(coin<c){beep(150,.2,'sawtooth');return toast('เหรียญไม่พอ')}
   coin-=c;up[o.k]=l+1;ST('coin',coin);ST('up',up);beep(900,.12,'triangle');renderShop()}}
  d.appendChild(t);b.appendChild(d)});paint()}

const cv=$('cv'),X=cv.getContext('2d'),N=20,CS=cv.width/N;
let sn,dir,q,food,orb,orbT,score,gain=0,combo,cT,shield,x2,mag,speed,acc,last,raf,alive=false;
function addCoin(n){if(n<=0)return;coin+=n;gain+=n;ST('coin',coin);paint()}
function cell(){let p,t=0;do{p={x:Math.random()*N|0,y:Math.random()*N|0};t++}
 while(t<200&&sn.some(s=>s.x==p.x&&s.y==p.y));return p}
function newFood(){const p=cell();p.g=Math.random()<.12+up.lk*.05;food=p}
function start(){beep(600,.08,'triangle');
 sn=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};q=[];
 score=0;gain=0;combo=1;cT=0;shield=up.sh;x2=0;mag=0;orb=null;orbT=5000;
 speed=165+up.sl*18;acc=0;alive=true;newFood();show('game');hud();
 last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function quit(){alive=false;cancelAnimationFrame(raf);show('menu')}
function turn(x,y){if(!alive)return;const l=q.length?q[q.length-1]:dir;
 if((x==-l.x&&y==-l.y)||(x==l.x&&y==l.y))return;if(q.length<2)q.push({x,y})}
function hud(){$('hs').textContent=score;$('hg').textContent=gain;
 $('hp').textContent=shield;$('hc').textContent='x'+combo}
function loop(t){if(!alive)return;const dt=Math.min(100,t-last);last=t;acc+=dt;
 let g=0;while(acc>=speed&&g++<3){acc-=speed;step();if(!alive)return}
 x2=Math.max(0,x2-dt);mag=Math.max(0,mag-dt);cT=Math.max(0,cT-dt);if(cT<=0)combo=1;
 orbT-=dt;if(orbT<=0&&!orb){orbT=7000+Math.random()*4000;
  const p=cell();p.t=['🛡️','⭐','🧲'][Math.random()*3|0];p.life=9000;orb=p}
 if(orb){orb.life-=dt;if(orb.life<=0)orb=null}
 draw();raf=requestAnimationFrame(loop)}
function step(){if(q.length)dir=q.shift();
 const h={x:sn[0].x+dir.x,y:sn[0].y+dir.y};
 const bad=h.x<0||h.y<0||h.x>=N||h.y>=N||sn.some((s,i)=>i<sn.length-1&&s.x==h.x&&s.y==h.y);
 if(bad){if(shield>0){shield--;beep(220,.2,'sawtooth');toast('🛡️ เกราะช่วยไว้!');
   h.x=(h.x+N)%N;h.y=(h.y+N)%N;
   if(sn.some((s,i)=>i<sn.length-1&&s.x==h.x&&s.y==h.y))sn=sn.slice(0,3)}
  else return die()}
 sn.unshift(h);
 if(orb&&orb.x==h.x&&orb.y==h.y){beep(1200,.12,'triangle');
  if(orb.t=='🛡️'){shield++;toast('🛡️ ได้เกราะ')}
  else if(orb.t=='⭐'){x2=8000;toast('⭐ คะแนน x2')}
  else{mag=7000;toast('🧲 แม่เหล็กทำงาน')}orb=null}
 if(mag>0&&(food.x!=h.x||food.y!=h.y)){
  if(Math.abs(food.x-h.x)>Math.abs(food.y-h.y))food.x+=Math.sign(h.x-food.x);
  else food.y+=Math.sign(h.y-food.y)}
 if(h.x==food.x&&h.y==food.y){
  combo=cT>0?Math.min(8,combo+1):1;cT=2500;
  score+=(food.g?30:10)*combo*(x2>0?2:1);
  addCoin(Math.round((food.g?5:1)*(1+up.mu*.25)));
  beep(food.g?1000:560+combo*40,.09,'triangle');
  if(sn.length%5==0)speed=Math.max(62,speed-6);newFood()}
 else sn.pop();
 hud()}
function die(){alive=false;cancelAnimationFrame(raf);beep(150,.4,'sawtooth');
 addCoin(Math.round(score/40*(1+up.mu*.25)));
 const nb=score>best;if(nb){best=score;ST('best',best)}
 $('oe').textContent=nb?'🏆':'💀';$('os').textContent=score;
 $('ob').textContent='ยาว '+sn.length+' ช่อง · สถิติ '+best;
 $('oc').textContent='ได้รับ +'+gain+' 🪙';show('over')}
function rr(x,y,w,h,r){if(X.roundRect){X.beginPath();X.roundRect(x,y,w,h,r);X.fill()}else X.fillRect(x,y,w,h)}
function draw(){const W=cv.width;
 X.fillStyle='#060a14';X.fillRect(0,0,W,W);
 X.strokeStyle='rgba(74,222,128,.07)';X.lineWidth=1;
 for(let i=1;i<N;i++){X.beginPath();X.moveTo(i*CS,0);X.lineTo(i*CS,W);X.moveTo(0,i*CS);X.lineTo(W,i*CS);X.stroke()}
 X.font=(CS*.8|0)+'px serif';X.textAlign='center';X.textBaseline='middle';
 X.fillText(food.g?'🍊':'🍎',food.x*CS+CS/2,food.y*CS+CS/2);
 if(orb)X.fillText(orb.t,orb.x*CS+CS/2,orb.y*CS+CS/2);
 for(let i=sn.length-1;i>=0;i--){const s=sn[i];
  X.fillStyle=i?'#22c55e':'#bbf7d0';rr(s.x*CS+1,s.y*CS+1,CS-2,CS-2,i?4:7)}
 if(shield>0){X.strokeStyle='#22d3ee';X.lineWidth=2;X.beginPath();
  X.arc(sn[0].x*CS+CS/2,sn[0].y*CS+CS/2,CS*.85,0,7);X.stroke()}
 if(combo>1){X.fillStyle='#fb923c';X.font='900 17px system-ui';X.fillText('COMBO x'+combo,W/2,18)}}
addEventListener('keydown',e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
 if(m[e.key]){e.preventDefault();turn(m[e.key][0],m[e.key][1])}});
let tx,ty;cv.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
cv.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
 if(Math.abs(dx)<18&&Math.abs(dy)<18)return;
 Math.abs(dx)>Math.abs(dy)?turn(dx>0?1:-1,0):turn(0,dy>0?1:-1)});
paint();
</script></body></html>
