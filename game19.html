<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>⚡ วัดรีเฟล็กซ์</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#030713;color:#e6f4ff;display:grid;place-items:center;min-height:100vh;padding:10px}
.app{width:100%;max-width:380px;background:#08142a;border:1px solid #16305a;border-radius:20px;padding:14px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.bar h1{flex:1;font-size:16px;color:#fbbf24}
.coin{background:#3a2c07;color:#fbbf24;border:1px solid #6b5210;padding:6px 12px;border-radius:99px;font-weight:800;font-size:14px}
.pg{display:none}.pg.on{display:block}
.card{background:#050f22;border:1px solid #16305a;border-radius:14px;padding:16px;text-align:center}
.big{font-size:30px;font-weight:900;color:#fbbf24}
.mut{font-size:12px;color:#8fa9c8;line-height:1.7}
button{border:0;cursor:pointer;font-family:inherit}
.btn{width:100%;padding:13px;border-radius:13px;font-size:15px;font-weight:800;color:#fff;background:#ca8a04;margin-top:8px}
.btn.g{background:#16a34a}.btn.o{background:#d97706}.btn.d{background:#122a4a;color:#cbd5e1}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hud{display:flex;gap:6px;margin:10px 0}
.hud div{flex:1;background:#050f22;border:1px solid #16305a;border-radius:11px;padding:7px;text-align:center;font-size:10px;color:#8fa9c8}
.hud b{display:block;font-size:15px;color:#e6f4ff}
.item{display:flex;gap:10px;align-items:center;background:#050f22;border:1px solid #16305a;border-radius:13px;padding:10px;margin-bottom:8px}
.item .ic{font-size:22px}.item .tx{flex:1}.item b{font-size:13px}.item p{font-size:11px;color:#8fa9c8}
.item button{padding:9px 12px;border-radius:10px;background:#f59e0b;color:#2b1a00;font-weight:800;font-size:12px}
.item button:disabled{background:#122a4a;color:#5b7398}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0c2545;border:1px solid #1d4373;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
#pad{height:230px;border-radius:18px;display:grid;place-items:center;text-align:center;
 background:#7f1d1d;border:2px solid #b91c1c;cursor:pointer;user-select:none;transition:background .06s}
#pad.go{background:#15803d;border-color:#22c55e}
#pad.wait{background:#7f1d1d;border-color:#b91c1c}
#pad.idle{background:#1e3a5f;border-color:#2a5691}
#pad b{font-size:26px;display:block}#pad span{font-size:13px;color:#dbeafe;margin-top:6px;display:block}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:100%;height:7px;border-radius:7px;background:#122a4a}
.dots i.ok{background:#fbbf24}
</style></head><body>
<div class="app">
<div class="bar"><h1>⚡ วัดรีเฟล็กซ์</h1><div class="coin">🪙 <span id="cn">0</span></div></div>

<div id="menu" class="pg on">
 <div class="card"><div style="font-size:52px">⚡</div><div class="big" id="bs">—</div>
 <div class="mut">สถิติเร็วที่สุด (มิลลิวินาที)</div></div>
 <p class="mut" style="margin-top:10px">รอจนกรอบเปลี่ยนเป็น 🟢 แล้วแตะให้เร็วที่สุด<br>
 เล่น 5 รอบต่อเกม · แตะก่อนไฟเขียว = ฟาวล์ทันที</p>
 <button class="btn g" onclick="start()">▶ เริ่มทดสอบ</button>
 <button class="btn o" onclick="openShop()">🛒 ร้านค้า</button>
</div>

<div id="shop" class="pg"><div id="ups"></div><button class="btn d" onclick="show('menu')">← กลับ</button></div>

<div id="game" class="pg">
 <div id="pad" class="idle"><div><b id="ptx">แตะเพื่อเริ่มรอบ</b><span id="psub">รอบที่ 1 จาก 5</span></div></div>
 <div class="dots" id="dots"></div>
 <div class="hud"><div>รอบ<b id="hr">1/5</b></div><div>ล่าสุด<b id="hl">—</b></div>
 <div>เฉลี่ย<b id="ha">—</b></div><div>เหรียญ<b id="hg">0</b></div></div>
 <button class="btn d" onclick="quit()">🏠 ออก</button>
</div>

<div id="over" class="pg">
 <div class="card"><div style="font-size:44px" id="oe">🏁</div><div class="big" id="os">0</div>
 <div class="mut" id="ob"></div><div style="margin-top:8px;color:#fbbf24;font-weight:800" id="oc"></div></div>
 <button class="btn o" id="rt" onclick="useRetry()" style="display:none">↩️ ใช้ตั๋วรีทราย (0)</button>
 <button class="btn g" onclick="start()">🔄 ทดสอบใหม่</button>
 <div class="row"><button class="btn o" onclick="openShop()">🛒 ร้านค้า</button>
 <button class="btn d" onclick="show('menu')">🏠 เมนู</button></div>
</div>
</div><div class="toast" id="tst"></div>
<script>
const K='rfx_',$=i=>document.getElementById(i);
const LD=(k,d)=>{try{const v=localStorage.getItem(K+k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const ST=(k,v)=>{try{localStorage.setItem(K+k,JSON.stringify(v))}catch(e){}};
let coin=LD('coin',0),up=LD('up',{bn:0,qk:0,mu:0,rt:0}),best=LD('best',0);
let AC;function beep(f,d,t,v){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
 if(AC.state=='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();
 o.type=t||'square';o.frequency.value=f;g.gain.setValueAtTime(v||.08,AC.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
 o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function paint(){$('cn').textContent=coin;$('bs').textContent=best?best+' ms':'—';
 document.querySelectorAll('[data-c]').forEach(b=>b.disabled=coin<+b.dataset.c)}
function toast(m){const t=$('tst');t.textContent=m;t.classList.add('on');
 clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('on'),1400)}
function show(id){document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));$(id).classList.add('on');paint()}
const UPS=[{k:'bn',i:'🎁',n:'โบนัสต่อรอบ',d:'+1 เหรียญทุกรอบที่ทำสำเร็จ',max:4,c:l=>120+l*130},
{k:'qk',i:'⚡',n:'โบนัสสายฟ้า',d:'ตอบไวกว่า 250ms รับเพิ่ม +3🪙 ต่อระดับ',max:3,c:l=>180+l*190},
{k:'mu',i:'💰',n:'ตัวคูณเหรียญ',d:'รับเหรียญ +25% ต่อระดับ',max:4,c:l=>150+l*140},
{k:'rt',i:'↩️',n:'ตั๋วรีทราย',d:'เล่นรอบที่ฟาวล์ใหม่โดยไม่จบเกม',a:1,c:()=>90}];
function openShop(){show('shop');renderShop()}
function renderShop(){const b=$('ups');b.innerHTML='';
 UPS.forEach(o=>{const l=up[o.k]|0,mx=!o.a&&l>=o.max,c=o.c(l);
  const d=document.createElement('div');d.className='item';
  d.innerHTML='<div class="ic">'+o.i+'</div><div class="tx"><b>'+o.n+
   ' <span style="color:#fbbf24">'+(o.a?'x'+l:'Lv'+l+'/'+o.max)+'</span></b><p>'+o.d+'</p></div>';
  const t=document.createElement('button');t.textContent=mx?'MAX':'🪙 '+c;
  if(mx)t.disabled=true;else{t.dataset.c=c;t.onclick=()=>{
   if(coin<c){beep(150,.2,'sawtooth');return toast('เหรียญไม่พอ')}
   coin-=c;up[o.k]=l+1;ST('coin',coin);ST('up',up);beep(900,.12,'triangle');
   toast(o.a?'ซื้อแล้ว!':'อัปเป็น Lv'+(l+1));renderShop()}}
  d.appendChild(t);b.appendChild(d)});paint()}
function addCoin(n){n=Math.round(n*(1+up.mu*.25));if(n<=0)return;coin+=n;gain+=n;ST('coin',coin);paint()}

const ROUNDS=5,pad=$('pad');
let st='idle',rnd=0,times=[],gain=0,t0=0,timer=null,alive=false;
function start(){beep(600,.1,'triangle');
 rnd=0;times=[];gain=0;alive=true;st='idle';
 $('rt').style.display='none';show('game');setPad('idle','แตะเพื่อเริ่มรอบ','รอบที่ 1 จาก '+ROUNDS);hud()}
function quit(){alive=false;clearTimeout(timer);save();show('menu')}
function setPad(cls,txt,sub){pad.className=cls;$('ptx').textContent=txt;$('psub').textContent=sub}
function hud(){$('hr').textContent=Math.min(rnd+1,ROUNDS)+'/'+ROUNDS;
 $('hl').textContent=times.length?times[times.length-1]+' ms':'—';
 $('ha').textContent=times.length?Math.round(times.reduce((a,b)=>a+b,0)/times.length)+' ms':'—';
 $('hg').textContent=gain;
 const d=$('dots');d.innerHTML='';
 for(let i=0;i<ROUNDS;i++){const e=document.createElement('i');
  if(i<times.length)e.className='ok';d.appendChild(e)}}
function arm(){if(!alive)return;st='wait';
 setPad('wait','⏳ รอสัญญาณ...','อย่าเพิ่งแตะ!');
 clearTimeout(timer);
 timer=setTimeout(()=>{if(!alive||st!='wait')return;
  st='go';t0=Date.now();setPad('go','🟢 แตะเลย!','เร็วเข้า!');
  beep(1000,.09,'triangle')},1200+Math.random()*2600)}
function hit(){if(!alive)return;
 if(st=='idle'){beep(700,.06,'triangle');arm();return}
 if(st=='wait'){clearTimeout(timer);st='dead';beep(150,.35,'sawtooth');
  setPad('idle','❌ ฟาวล์!','แตะก่อนไฟเขียว');return setTimeout(()=>foul(),500)}
 if(st=='go'){const ms=Date.now()-t0;st='idle';
  times.push(ms);rnd++;
  let c=Math.max(1,Math.round((620-ms)/45))+up.bn;
  if(ms<250)c+=up.qk*3;
  addCoin(c);
  beep(ms<250?1250:900,.1,'triangle');
  if(!best||ms<best){best=ms;ST('best',best);toast('🏆 สถิติใหม่ '+ms+' ms!')}
  hud();
  if(rnd>=ROUNDS)return setTimeout(finish,700);
  setPad('idle',ms+' ms · '+(ms<250?'สุดยอด!':ms<400?'ดีมาก':'ผ่าน'),
   'แตะเพื่อเริ่มรอบที่ '+(rnd+1))}}
function foul(){alive=false;
 $('oe').textContent='❌';$('os').textContent='ฟาวล์';
 $('ob').textContent='แตะก่อนไฟเขียวในรอบที่ '+(rnd+1)+' · สถิติดีสุด '+(best?best+' ms':'—');
 $('oc').textContent='ได้รับ +'+gain+' 🪙';
 const b=$('rt');
 if((up.rt|0)>0){b.style.display='block';b.textContent='↩️ ใช้ตั๋วรีทราย ('+up.rt+')'}
 else b.style.display='none';
 save();show('over')}
function useRetry(){
 if((up.rt|0)<=0){beep(150,.2,'sawtooth');return toast('ไม่มีตั๋วรีทราย')}
 up.rt--;ST('up',up);beep(850,.15,'triangle');toast('↩️ เล่นรอบนี้ใหม่');
 alive=true;st='idle';$('rt').style.display='none';
 show('game');setPad('idle','แตะเพื่อเริ่มรอบ','รอบที่ '+(rnd+1)+' จาก '+ROUNDS);hud()}
function finish(){alive=false;
 const avg=Math.round(times.reduce((a,b)=>a+b,0)/times.length);
 const fast=Math.min.apply(null,times);
 addCoin(Math.max(2,Math.round((600-avg)/25)));
 $('oe').textContent=avg<260?'🥇':avg<380?'🥈':'🥉';
 $('os').textContent=avg+' ms';
 $('ob').textContent='เฉลี่ย '+avg+' ms · เร็วสุดรอบนี้ '+fast+' ms · สถิติ '+best+' ms';
 $('oc').textContent='ได้รับ +'+gain+' 🪙';
 $('rt').style.display='none';beep(1100,.2,'triangle');save();show('over')}
pad.addEventListener('touchstart',e=>{e.preventDefault();hit()},{passive:false});
pad.addEventListener('mousedown',e=>{e.preventDefault();hit()});
addEventListener('keydown',e=>{if(e.code=='Space'&&$('game').classList.contains('on')){e.preventDefault();hit()}});
function save(){ST('coin',coin);ST('up',up);ST('best',best)}
addEventListener('visibilitychange',()=>{if(document.hidden)save()});
addEventListener('beforeunload',save);
paint();
</script></body></html>
