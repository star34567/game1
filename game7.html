<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>🃏 จับคู่การ์ด</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#06141a;color:#e6fbff;display:grid;place-items:center;min-height:100vh;padding:10px}
.app{width:100%;max-width:370px;background:#0c2430;border:1px solid #174457;border-radius:18px;padding:14px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}.bar h1{flex:1;font-size:16px;color:#2dd4bf}
.coin{background:#3a2c07;color:#fbbf24;border:1px solid #6b5210;padding:6px 12px;border-radius:99px;font-weight:800;font-size:14px}
.pg{display:none}.pg.on{display:block}
.card{background:#071b25;border:1px solid #174457;border-radius:14px;padding:16px;text-align:center}
.big{font-size:30px;font-weight:900;color:#fbbf24}.mut{font-size:12px;color:#8fb8c4;line-height:1.7}
button{border:0;cursor:pointer;font-family:inherit}
.btn{width:100%;padding:13px;border-radius:12px;font-size:15px;font-weight:800;color:#fff;background:#0d9488;margin-top:8px}
.btn.g{background:#16a34a}.btn.o{background:#d97706}.btn.d{background:#123646;color:#d7eef5}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hud{display:flex;gap:6px;margin:10px 0}
.hud div{flex:1;background:#071b25;border:1px solid #174457;border-radius:10px;padding:7px;text-align:center;font-size:10px;color:#8fb8c4}
.hud b{display:block;font-size:15px;color:#fff}
.tb{height:9px;background:#071b25;border:1px solid #174457;border-radius:99px;overflow:hidden;margin-bottom:10px}
.tb i{display:block;height:100%;background:linear-gradient(90deg,#0d9488,#2dd4bf)}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.cd{aspect-ratio:.82;border-radius:10px;background:#134e5a;display:grid;place-items:center;font-size:25px;cursor:pointer;user-select:none;
border:1px solid #1d6d7d;transition:.15s}
.cd.open{background:#e0f7fa;color:#083344}
.cd.done{background:#065f46;opacity:.45;pointer-events:none}
.cd:not(.open) span{visibility:hidden}
.item{display:flex;gap:10px;align-items:center;background:#071b25;border:1px solid #174457;border-radius:12px;padding:10px;margin-bottom:8px}
.item .tx{flex:1}.item b{font-size:13px}.item p{font-size:11px;color:#8fb8c4}
.item button{padding:9px 12px;border-radius:10px;background:#f59e0b;color:#2b1a00;font-weight:800;font-size:12px}
.item button:disabled{background:#123646;color:#5f8a99}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0e3040;border:1px solid #1b5a70;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
</style></head><body>
<div class="app">
<div class="bar"><h1>🃏 จับคู่การ์ด</h1><div class="coin">🪙 <span id="cn">0</span></div></div>

<div id="menu" class="pg on">
 <div class="card"><div style="font-size:50px">🃏</div><div class="big" id="bs">1</div><div class="mut">ด่านสูงสุด</div></div>
 <p class="mut" style="margin-top:10px">จับคู่ให้ครบก่อนหมดเวลา · จับคู่ถูกติดกันได้คอมโบ<br>
 ผ่านด่านได้เวลาเพิ่ม + เหรียญโบนัส · ด่านสูงขึ้นการ์ดเยอะขึ้น</p>
 <button class="btn g" onclick="start()">▶ เริ่มเล่น</button>
 <button class="btn o" onclick="openShop()">🛒 ร้านค้า</button></div>

<div id="shop" class="pg"><div id="ups"></div><button class="btn d" onclick="show('menu')">← กลับ</button></div>

<div id="game" class="pg">
 <div class="hud"><div>ด่าน<b id="hl">1</b></div><div>คะแนน<b id="hs">0</b></div>
 <div>เหรียญ<b id="hg">0</b></div><div>คอมโบ<b id="hc">x1</b></div></div>
 <div class="tb"><i id="tf" style="width:100%"></i></div>
 <div id="grid"></div>
 <div class="row" style="margin-top:9px"><button class="btn d" onclick="peek()">👁️ แอบดู (🪙30)</button>
 <button class="btn d" onclick="quit()">🏠 ออก</button></div></div>

<div id="over" class="pg">
 <div class="card"><div style="font-size:42px" id="oe">⏰</div><div class="big" id="os">0</div>
 <div class="mut" id="ob"></div><div style="margin-top:8px;color:#fbbf24;font-weight:800" id="oc"></div></div>
 <button class="btn g" onclick="start()">🔄 เล่นอีกครั้ง</button>
 <div class="row"><button class="btn o" onclick="openShop()">🛒 ร้านค้า</button>
 <button class="btn d" onclick="show('menu')">🏠 เมนู</button></div></div>
</div><div class="toast" id="tst"></div>
<script>
const K='mem_',$=i=>document.getElementById(i);
const LD=(k,d)=>{try{const v=localStorage.getItem(K+k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const ST=(k,v)=>{try{localStorage.setItem(K+k,JSON.stringify(v))}catch(e){}};
let coin=LD('coin',0),up=LD('up',{tm:0,pk:0,cb:0,mu:0}),best=LD('best',1);
let AC;function beep(f,d,t){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
 if(AC.state=='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();
 o.type=t||'square';o.frequency.value=f;g.gain.setValueAtTime(.09,AC.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);
 o.start();o.stop(AC.currentTime+d)}catch(e){}}
function paint(){$('cn').textContent=coin;$('bs').textContent=best;
 document.querySelectorAll('[data-c]').forEach(b=>b.disabled=coin<+b.dataset.c)}
function toast(m){const t=$('tst');t.textContent=m;t.classList.add('on');clearTimeout(t._);
 t._=setTimeout(()=>t.classList.remove('on'),1400)}
function show(id){document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));$(id).classList.add('on');paint()}
const UPS=[{k:'tm',n:'เวลาเริ่มต้น',d:'+8 วินาทีต่อระดับ',i:'⏱️',max:4,c:l=>110+l*115},
{k:'pk',n:'แอบดูฟรี',d:'เริ่มเกมพร้อมสิทธิ์แอบดู',i:'👁️',max:3,c:l=>150+l*160},
{k:'cb',n:'คอมโบแรง',d:'คอมโบให้คะแนนมากขึ้น',i:'🔥',max:4,c:l=>130+l*135},
{k:'mu',n:'ตัวคูณเหรียญ',d:'รับเหรียญ +25% ต่อระดับ',i:'💰',max:4,c:l=>150+l*140}];
function openShop(){show('shop');renderShop()}
function renderShop(){const b=$('ups');b.innerHTML='';
 UPS.forEach(o=>{const l=up[o.k]|0,mx=l>=o.max,c=o.c(l);const d=document.createElement('div');d.className='item';
  d.innerHTML='<div style="font-size:22px">'+o.i+'</div><div class="tx"><b>'+o.n+
   ' <span style="color:#fbbf24">Lv'+l+'/'+o.max+'</span></b><p>'+o.d+'</p></div>';
  const t=document.createElement('button');t.textContent=mx?'MAX':'🪙 '+c;
  if(mx)t.disabled=true;else{t.dataset.c=c;t.onclick=()=>{if(coin<c){beep(150,.2,'sawtooth');return toast('เหรียญไม่พอ')}
   coin-=c;up[o.k]=l+1;ST('coin',coin);ST('up',up);beep(900,.1,'triangle');renderShop()}}
  d.appendChild(t);b.appendChild(d)});paint()}
function addCoin(n){if(n<=0)return;coin+=n;gain+=n;ST('coin',coin);paint()}

const POOL=['🍎','🍌','🍇','🍓','🍑','🍍','🥝','🍉','🐶','🐱','🐼','🦊','🐸','🐵','🦄','🐙','⚽','🎸','🚀','🎈'];
let level,score,gain,combo,time,maxTime,lock,first,left,peekN,tmr,running=false;
function start(){beep(600,.1,'triangle');level=1;score=0;gain=0;combo=0;peekN=up.pk;
 maxTime=time=50+up.tm*8;running=true;show('game');build();
 clearInterval(tmr);tmr=setInterval(()=>{if(!running)return;time-=.25;
  $('tf').style.width=Math.max(0,time/maxTime*100)+'%';
  if(time<=0)end('⏰ หมดเวลา!')},250)}
function quit(){running=false;clearInterval(tmr);show('menu')}
function hud(){$('hl').textContent=level;$('hs').textContent=score;
 $('hg').textContent=gain;$('hc').textContent='x'+Math.max(1,combo)}
function build(){const pairs=Math.min(10,3+level);
 const pick=POOL.slice().sort(()=>Math.random()-.5).slice(0,pairs);
 const deck=pick.concat(pick).sort(()=>Math.random()-.5);
 left=pairs;lock=false;first=null;
 const g=$('grid');g.innerHTML='';g.style.gridTemplateColumns='repeat('+(pairs<=4?4:pairs<=6?4:5)+',1fr)';
 deck.forEach(e=>{const d=document.createElement('div');d.className='cd';
  d.innerHTML='<span>'+e+'</span>';d.dataset.e=e;d.onclick=()=>flip(d);g.appendChild(d)});
 hud()}
function flip(d){if(!running||lock||d.classList.contains('open')||d.classList.contains('done'))return;
 d.classList.add('open');beep(700,.05,'triangle');
 if(!first){first=d;return}
 lock=true;
 if(first.dataset.e===d.dataset.e){
  combo=Math.min(8,combo+1);
  const pt=Math.round(20*combo*(1+up.cb*.2));score+=pt;
  addCoin(Math.round(2*combo*(1+up.mu*.25)));
  beep(1000+combo*60,.12,'triangle');
  first.classList.add('done');d.classList.add('done');first=null;lock=false;left--;
  if(left<=0)nextLevel();
 }else{combo=0;beep(200,.12,'sawtooth');
  setTimeout(()=>{first.classList.remove('open');d.classList.remove('open');
   first=null;lock=false},520)}
 hud()}
function nextLevel(){beep(1300,.3,'triangle');
 const bonus=Math.round((10+level*4)*(1+up.mu*.25));addCoin(bonus);
 score+=level*80;
 if(level>best){best=level;ST('best',best)}
 toast('🎉 ผ่านด่าน '+level+' · +'+bonus+' 🪙');
 level++;maxTime+=6;time=Math.min(maxTime,time+12);
 setTimeout(()=>{if(running)build()},450)}
function peek(){if(!running)return;
 if(peekN>0)peekN--;else{if(coin<30)return toast('เหรียญไม่พอ');coin-=30;ST('coin',coin);paint()}
 beep(900,.15,'sine');lock=true;
 const cs=[...document.querySelectorAll('.cd:not(.done)')];
 cs.forEach(c=>c.classList.add('open'));
 setTimeout(()=>{cs.forEach(c=>{if(c!==first)c.classList.remove('open')});lock=false},1500)}
function end(msg){running=false;clearInterval(tmr);beep(160,.4,'sawtooth');
 addCoin(Math.round(score/90*(1+up.mu*.25)));
 $('oe').textContent='⏰';$('os').textContent=score.toLocaleString();
 $('ob').textContent=msg+' · ไปถึงด่าน '+level+' · ด่านสูงสุด '+best;
 $('oc').textContent='ได้รับ +'+gain+' 🪙';show('over')}
paint();
</script></body></html>
