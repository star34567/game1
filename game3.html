<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>🐤 บินลอดท่อ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#031a2e;color:#e6f4ff;display:grid;place-items:center;min-height:100vh;padding:10px}
.app{width:100%;max-width:370px;background:#07263f;border:1px solid #17456b;border-radius:20px;padding:14px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.bar h1{flex:1;font-size:16px;color:#38bdf8}
.coin{background:#3a2c07;color:#fbbf24;border:1px solid #6b5210;padding:6px 12px;border-radius:99px;font-weight:800;font-size:14px}
.pg{display:none}.pg.on{display:block}
.card{background:#041d31;border:1px solid #17456b;border-radius:14px;padding:16px;text-align:center}
.big{font-size:30px;font-weight:900;color:#fbbf24}
.mut{font-size:12px;color:#8fb4d4;line-height:1.7}
button{border:0;cursor:pointer;font-family:inherit}
.btn{width:100%;padding:13px;border-radius:13px;font-size:15px;font-weight:800;color:#fff;background:#0284c7;margin-top:8px}
.btn.g{background:#16a34a}.btn.o{background:#d97706}.btn.d{background:#0f3352;color:#cbd5e1}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hud{display:flex;gap:6px;margin:10px 0}
.hud div{flex:1;background:#041d31;border:1px solid #17456b;border-radius:11px;padding:7px;text-align:center;font-size:10px;color:#8fb4d4}
.hud b{display:block;font-size:15px;color:#e6f4ff}
canvas{width:100%;display:block;border-radius:14px;border:1px solid #17456b;touch-action:none}
.item{display:flex;gap:10px;align-items:center;background:#041d31;border:1px solid #17456b;border-radius:13px;padding:10px;margin-bottom:8px}
.item .ic{font-size:22px}.item .tx{flex:1}.item b{font-size:13px}.item p{font-size:11px;color:#8fb4d4}
.item button{padding:9px 12px;border-radius:10px;background:#f59e0b;color:#2b1a00;font-weight:800;font-size:12px}
.item button:disabled{background:#0f3352;color:#5f7f9d}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0b3557;border:1px solid #1d5a87;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
</style></head><body>
<div class="app">
<div class="bar"><h1>🐤 บินลอดท่อ</h1><div class="coin">🪙 <span id="cn">0</span></div></div>

<div id="menu" class="pg on">
 <div class="card"><div style="font-size:52px">🐤</div><div class="big" id="bs">0</div>
 <div class="mut">ท่อที่ผ่านมากที่สุด</div></div>
 <p class="mut" style="margin-top:10px">🪙 เหรียญ +1 · 💎 เพชร +8 · 🛡️ เกราะ<br>
 ผ่านทุก 5 ท่อได้เหรียญโบนัส · คะแนนเกิน 12 ท่อจะเริ่มขยับ</p>
 <button class="btn g" onclick="start()">▶ เริ่มบิน</button>
 <button class="btn o" onclick="openShop()">🛒 ร้านค้า</button>
</div>

<div id="shop" class="pg"><div id="ups"></div>
 <button class="btn d" onclick="show('menu')">← กลับ</button></div>

<div id="game" class="pg">
 <canvas id="cv" width="300" height="440"></canvas>
 <div class="hud"><div>ท่อ<b id="hs">0</b></div><div>เหรียญ<b id="hg">0</b></div>
 <div>เกราะ<b id="hp">0</b></div></div>
 <p class="mut" style="text-align:center">แตะจอ / กด Space เพื่อบิน</p>
 <button class="btn d" onclick="quit()">🏠 ออก</button>
</div>

<div id="over" class="pg">
 <div class="card"><div style="font-size:44px" id="oe">💥</div><div class="big" id="os">0</div>
 <div class="mut" id="ob"></div><div style="margin-top:8px;color:#fbbf24;font-weight:800" id="oc"></div></div>
 <button class="btn g" onclick="start()">🔄 บินอีกครั้ง</button>
 <div class="row"><button class="btn o" onclick="openShop()">🛒 ร้านค้า</button>
 <button class="btn d" onclick="show('menu')">🏠 เมนู</button></div>
</div>
</div><div class="toast" id="tst"></div>
<script>
const K='fly_',$=i=>document.getElementById(i);
const LD=(k,d)=>{try{const v=localStorage.getItem(K+k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const ST=(k,v)=>{try{localStorage.setItem(K+k,JSON.stringify(v))}catch(e){}};
let coin=LD('coin',0),up=LD('up',{gp:0,sh:0,mg:0,mu:0}),best=LD('best',0);
let AC;function beep(f,d,t){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
 if(AC.state=='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();
 o.type=t||'square';o.frequency.value=f;g.gain.setValueAtTime(.1,AC.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
 o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function paint(){$('cn').textContent=coin;$('bs').textContent=best;
 document.querySelectorAll('[data-c]').forEach(b=>b.disabled=coin<+b.dataset.c)}
function toast(m){const t=$('tst');t.textContent=m;t.classList.add('on');
 clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('on'),1400)}
function show(id){document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));$(id).classList.add('on');paint()}
const UPS=[{k:'gp',i:'↔️',n:'ช่องท่อกว้างขึ้น',d:'+6px ต่อระดับ',max:4,c:l=>180+l*180},
{k:'sh',i:'🛡️',n:'เกราะเริ่มเกม',d:'ชนได้ฟรี 1 ครั้ง',max:3,c:l=>150+l*160},
{k:'mg',i:'🧲',n:'แม่เหล็กเหรียญ',d:'ดูดเหรียญรัศมีกว้างขึ้น',max:4,c:l=>100+l*100},
{k:'mu',i:'💰',n:'ตัวคูณเหรียญ',d:'รับเหรียญ +25% ต่อระดับ',max:4,c:l=>150+l*140}];
function openShop(){show('shop');renderShop()}
function renderShop(){const b=$('ups');b.innerHTML='';
 UPS.forEach(o=>{const l=up[o.k]|0,mx=l>=o.max,c=o.c(l);
  const d=document.createElement('div');d.className='item';
  d.innerHTML='<div class="ic">'+o.i+'</div><div class="tx"><b>'+o.n+
   ' <span style="color:#fbbf24">Lv'+l+'/'+o.max+'</span></b><p>'+o.d+'</p></div>';
  const t=document.createElement('button');t.textContent=mx?'MAX':'🪙 '+c;
  if(mx)t.disabled=true;else{t.dataset.c=c;t.onclick=()=>{
   if(coin<c){beep(150,.2,'sawtooth');return toast('เหรียญไม่พอ')}
   coin-=c;up[o.k]=l+1;ST('coin',coin);ST('up',up);beep(900,.12,'triangle');renderShop()}}
  d.appendChild(t);b.appendChild(d)});paint()}

const cv=$('cv'),X=cv.getContext('2d'),W=300,H=440;
let y,vy,pipes,items,score,gain=0,shield,frame,alive=false,last,raf;
function addCoin(n){if(n<=0)return;coin+=n;gain+=n;ST('coin',coin);paint()}
function start(){beep(600,.08,'triangle');
 y=190;vy=0;pipes=[];items=[];score=0;gain=0;frame=0;shield=up.sh;alive=true;
 show('game');hud();last=performance.now();
 cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function quit(){alive=false;cancelAnimationFrame(raf);show('menu')}
function flap(){if(!alive)return;vy=-6.1;beep(560,.06,'triangle')}
function hud(){$('hs').textContent=score;$('hg').textContent=gain;$('hp').textContent=shield}
function spawn(){const gap=112+up.gp*6-Math.min(22,score*.4);
 const h=44+Math.random()*(H-gap-130);
 pipes.push({x:W+10,h,gap,p:0,mv:score>12?(Math.random()-.5)*1.6:0,d:1});
 const r=Math.random();
 if(r<.55)items.push({x:W+34,y:h+gap/2,t:'🪙'});
 else if(r<.66)items.push({x:W+34,y:h+gap/2,t:'💎'});
 else if(r<.74)items.push({x:W+34,y:h+gap/2,t:'🛡️'})}
function loop(t){if(!alive)return;const dt=Math.min(40,t-last);last=t;const f=dt/16.7;frame++;
 vy+=.42*f;y+=vy*f;
 if(frame%92==0)spawn();
 const sp=2.4+Math.min(1.8,score*.03);
 pipes.forEach(p=>{p.x-=sp*f;
  if(p.mv){p.h+=p.mv*p.d*f;if(p.h<38||p.h>H-p.gap-100)p.d*=-1}
  if(!p.p&&p.x+42<62){p.p=1;score++;beep(900,.06,'triangle');
   if(score%5==0){addCoin(Math.round(3*(1+up.mu*.25)));toast('🎯 '+score+' ท่อ!')}}
  if(62+12>p.x&&62-12<p.x+42&&(y<p.h||y+24>p.h+p.gap))hit(false)});
 pipes=pipes.filter(p=>p.x>-50);
 const mr=24+up.mg*13;
 items.forEach(it=>{it.x-=sp*f;
  const dx=62-it.x,dy=y+12-it.y,d=Math.hypot(dx,dy);
  if(d<mr&&!it.got){it.x+=dx*.2;it.y+=dy*.2}
  if(d<20&&!it.got){it.got=1;beep(1300,.09,'triangle');
   if(it.t=='🪙')addCoin(Math.round(1*(1+up.mu*.25)));
   else if(it.t=='💎'){addCoin(Math.round(8*(1+up.mu*.25)));toast('💎 เพชร!')}
   else{shield++;toast('🛡️ ได้เกราะ')}}});
 items=items.filter(i=>!i.got&&i.x>-25);
 if(y>H-26||y<-20)hit(true);
 draw();hud();raf=requestAnimationFrame(loop)}
function hit(ground){if(!alive)return;
 if(shield>0&&!ground){shield--;beep(230,.2,'sawtooth');vy=-5;
  pipes.forEach(p=>{if(Math.abs(p.x-62)<72)p.x=-99});
  toast('🛡️ เกราะช่วยไว้!');return}
 alive=false;cancelAnimationFrame(raf);beep(150,.4,'sawtooth');
 addCoin(Math.round(score*1.2*(1+up.mu*.25)));
 const nb=score>best;if(nb){best=score;ST('best',best)}
 $('oe').textContent=nb?'🏆':'💥';$('os').textContent=score+' ท่อ';
 $('ob').textContent='สถิติสูงสุด '+best;
 $('oc').textContent='ได้รับ +'+gain+' 🪙';show('over')}
function draw(){const g=X.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'#38bdf8');g.addColorStop(1,'#bae6fd');X.fillStyle=g;X.fillRect(0,0,W,H);
 X.fillStyle='rgba(255,255,255,.7)';
 for(let i=0;i<3;i++){const cx=((i*130-frame*.3)%(W+120))-60;
  X.beginPath();X.arc(cx,50+i*40,17,0,7);X.arc(cx+20,50+i*40,23,0,7);X.fill()}
 pipes.forEach(p=>{X.fillStyle='#22c55e';
  X.fillRect(p.x,0,42,p.h);X.fillRect(p.x,p.h+p.gap,42,H);
  X.fillStyle='#15803d';X.fillRect(p.x-4,p.h-15,50,15);X.fillRect(p.x-4,p.h+p.gap,50,15)});
 X.font='19px serif';X.textAlign='center';X.textBaseline='middle';
 items.forEach(i=>X.fillText(i.t,i.x,i.y));
 X.fillStyle='#a16207';X.fillRect(0,H-24,W,24);
 X.save();X.translate(74,y+12);X.rotate(Math.max(-.5,Math.min(.9,vy/11)));
 X.font='28px serif';X.fillText('🐤',0,0);X.restore();
 if(shield>0){X.strokeStyle='#22d3ee';X.lineWidth=3;
  X.beginPath();X.arc(74,y+12,21,0,7);X.stroke()}
 X.fillStyle='#0f172a';X.font='900 32px system-ui';X.textAlign='center';
 X.strokeStyle='#fff';X.lineWidth=5;X.strokeText(score,W/2,52);X.fillText(score,W/2,52)}
cv.addEventListener('pointerdown',e=>{e.preventDefault();flap()});
addEventListener('keydown',e=>{if(e.code=='Space'){e.preventDefault();flap()}});
paint();
</script></body></html>
