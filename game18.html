<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>🏓 ปิงปองสู้ AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#030713;color:#e6f4ff;display:grid;place-items:center;min-height:100vh;padding:10px}
.app{width:100%;max-width:380px;background:#08142a;border:1px solid #16305a;border-radius:20px;padding:14px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.bar h1{flex:1;font-size:16px;color:#a3e635}
.coin{background:#3a2c07;color:#fbbf24;border:1px solid #6b5210;padding:6px 12px;border-radius:99px;font-weight:800;font-size:14px}
.pg{display:none}.pg.on{display:block}
.card{background:#050f22;border:1px solid #16305a;border-radius:14px;padding:16px;text-align:center}
.big{font-size:30px;font-weight:900;color:#fbbf24}
.mut{font-size:12px;color:#8fa9c8;line-height:1.7}
button{border:0;cursor:pointer;font-family:inherit}
.btn{width:100%;padding:13px;border-radius:13px;font-size:15px;font-weight:800;color:#fff;background:#65a30d;margin-top:8px}
.btn.g{background:#16a34a}.btn.o{background:#d97706}.btn.d{background:#122a4a;color:#cbd5e1}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hud{display:flex;gap:6px;margin:10px 0}
.hud div{flex:1;background:#050f22;border:1px solid #16305a;border-radius:11px;padding:7px;text-align:center;font-size:10px;color:#8fa9c8}
.hud b{display:block;font-size:15px;color:#e6f4ff}
canvas{width:100%;display:block;border-radius:14px;border:1px solid #16305a;background:#000;touch-action:none}
.item{display:flex;gap:10px;align-items:center;background:#050f22;border:1px solid #16305a;border-radius:13px;padding:10px;margin-bottom:8px}
.item .ic{font-size:22px}.item .tx{flex:1}.item b{font-size:13px}.item p{font-size:11px;color:#8fa9c8}
.item button{padding:9px 12px;border-radius:10px;background:#f59e0b;color:#2b1a00;font-weight:800;font-size:12px}
.item button:disabled{background:#122a4a;color:#5b7398}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0c2545;border:1px solid #1d4373;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
</style></head><body>
<div class="app">
<div class="bar"><h1>🏓 ปิงปองสู้ AI</h1><div class="coin">🪙 <span id="cn">0</span></div></div>

<div id="menu" class="pg on">
 <div class="card"><div style="font-size:52px">🏓</div><div class="big" id="bs">0</div>
 <div class="mut">แต้มสูงสุด</div></div>
 <p class="mut" style="margin-top:10px">ลากนิ้วเพื่อเลื่อนแป้น · ตีโดน +1🪙 · ทำแต้มใส่ AI +8🪙<br>
 มุมสะท้อนขึ้นกับจุดที่ลูกกระทบแป้น — ตีขอบแป้นจะได้มุมเฉียง</p>
 <button class="btn g" onclick="start()">▶ เริ่มแข่ง</button>
 <button class="btn o" onclick="openShop()">🛒 ร้านค้า</button>
</div>

<div id="shop" class="pg"><div id="ups"></div><button class="btn d" onclick="show('menu')">← กลับ</button></div>

<div id="game" class="pg">
 <canvas id="cv" width="320" height="440"></canvas>
 <div class="hud"><div>แต้ม<b id="hs">0</b></div><div>แรลลี่<b id="hr">0</b></div>
 <div>เหรียญ<b id="hg">0</b></div><div>ชีวิต<b id="hh">❤❤❤</b></div></div>
 <div class="row"><button class="btn o" id="tb" onclick="useSlow()">⏳ สโลว์โม (0)</button>
 <button class="btn d" onclick="quit()">🏠 ออก</button></div>
</div>

<div id="over" class="pg">
 <div class="card"><div style="font-size:44px">🏁</div><div class="big" id="os">0</div>
 <div class="mut" id="ob"></div><div style="margin-top:8px;color:#fbbf24;font-weight:800" id="oc"></div></div>
 <button class="btn g" onclick="start()">🔄 แข่งอีกครั้ง</button>
 <div class="row"><button class="btn o" onclick="openShop()">🛒 ร้านค้า</button>
 <button class="btn d" onclick="show('menu')">🏠 เมนู</button></div>
</div>
</div><div class="toast" id="tst"></div>
<script>
const K='png_',$=i=>document.getElementById(i);
const LD=(k,d)=>{try{const v=localStorage.getItem(K+k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const ST=(k,v)=>{try{localStorage.setItem(K+k,JSON.stringify(v))}catch(e){}};
let coin=LD('coin',0),up=LD('up',{pw:0,lf:0,mu:0,sw:0}),best=LD('best',0);
let AC;function beep(f,d,t,v){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
 if(AC.state=='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();
 o.type=t||'square';o.frequency.value=f;g.gain.setValueAtTime(v||.08,AC.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
 o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function paint(){$('cn').textContent=coin;$('bs').textContent=best;
 document.querySelectorAll('[data-c]').forEach(b=>b.disabled=coin<+b.dataset.c)}
function toast(m){const t=$('tst');t.textContent=m;t.classList.add('on');
 clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('on'),1400)}
function show(id){document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));$(id).classList.add('on');paint()}
const UPS=[{k:'pw',i:'📏',n:'แป้นยาวขึ้น',d:'+11px ต่อระดับ',max:4,c:l=>140+l*150},
{k:'lf',i:'❤️',n:'ชีวิตสำรอง',d:'+1 ชีวิตเริ่มต้น',max:3,c:l=>200+l*220},
{k:'mu',i:'💰',n:'ตัวคูณเหรียญ',d:'รับเหรียญ +25% ต่อระดับ',max:4,c:l=>150+l*140},
{k:'sw',i:'⏳',n:'สโลว์โม',d:'ลูกบอลช้าลงครึ่งหนึ่ง 4 วินาที',a:1,c:()=>85}];
function openShop(){show('shop');renderShop()}
function renderShop(){const b=$('ups');b.innerHTML='';
 UPS.forEach(o=>{const l=up[o.k]|0,mx=!o.a&&l>=o.max,c=o.c(l);
  const d=document.createElement('div');d.className='item';
  d.innerHTML='<div class="ic">'+o.i+'</div><div class="tx"><b>'+o.n+
   ' <span style="color:#fbbf24">'+(o.a?'x'+l:'Lv'+l+'/'+o.max)+'</span></b><p>'+o.d+'</p></div>';
  const t=document.createElement('button');t.textContent=mx?'MAX':'🪙 '+c;
  if(mx)t.disabled=true;else{t.dataset.c=c;t.onclick=()=>{
   if(coin<c){beep(150,.2,'sawtooth');return toast('เหรียญไม่พอ')}
   coin-=c;up[o.k]=l+1;ST('coin',coin);ST('up',up);beep(900,.12,'triangle');
   toast(o.a?'ซื้อแล้ว!':'อัปเป็น Lv'+(l+1));renderShop()}}
  d.appendChild(t);b.appendChild(d)});paint()}
function addCoin(n){n=Math.round(n*(1+up.mu*.25));if(n<=0)return;coin+=n;gain+=n;ST('coin',coin);paint()}

const cv=$('cv'),X=cv.getContext('2d'),W=320,H=440,R=7,PH=11,PY=H-28,AY=22;
let px,ax,bx,by,vx,vy,spd,lives,score,rally,gain=0,slow=0,alive=false,last=0,raf=0,serveT=0;
function pw(){return 54+up.pw*11}
function apw(){return 52}
function start(){beep(600,.1,'triangle');
 px=W/2;ax=W/2;lives=3+up.lf;score=0;rally=0;gain=0;slow=0;alive=true;
 serve(1);show('game');hud();last=performance.now();
 cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function serve(dir){bx=W/2;by=H/2;spd=4.3;
 const a=(Math.random()*.7-.35);
 vx=Math.sin(a)*spd;vy=Math.cos(a)*spd*dir;serveT=700}
function quit(){alive=false;cancelAnimationFrame(raf);save();show('menu')}
function hud(){$('hs').textContent=score;$('hr').textContent=rally;
 $('hg').textContent=gain;$('hh').textContent='❤'.repeat(Math.max(0,lives));
 $('tb').textContent='⏳ สโลว์โม ('+(up.sw|0)+')'}
function bounce(paddleX,halfW,dir){
 let rel=(bx-paddleX)/halfW;rel=Math.max(-1,Math.min(1,rel));
 const ang=rel*1.05;
 spd=Math.min(11,spd+.28);
 vx=Math.sin(ang)*spd;vy=Math.cos(ang)*spd*dir}
function loop(t){if(!alive)return;const dt=Math.min(40,t-last);last=t;let f=dt/16.7;
 if(slow>0){slow-=dt;f*=.45}
 if(serveT>0){serveT-=dt;draw();hud();raf=requestAnimationFrame(loop);return}
 bx+=vx*f;by+=vy*f;
 if(bx<R){bx=R;vx=Math.abs(vx);beep(420,.04,'triangle',.05)}
 if(bx>W-R){bx=W-R;vx=-Math.abs(vx);beep(420,.04,'triangle',.05)}
 const half=pw()/2;
 if(vy>0&&by+R>=PY&&by-R<=PY+PH){
  if(bx>px-half-R&&bx<px+half+R){by=PY-R;bounce(px,half,-1);
   rally++;score+=2;addCoin(1);beep(760,.06,'triangle')}}
 const ah=apw()/2;
 if(vy<0&&by-R<=AY+PH&&by+R>=AY){
  if(bx>ax-ah-R&&bx<ax+ah+R){by=AY+PH+R;bounce(ax,ah,1);
   rally++;beep(560,.06,'triangle')}}
 const aiSp=(2.5+Math.min(3.2,rally*.06))*f;
 const tgt=vy<0?bx:W/2;
 const err=Math.max(0,26-rally*.5);
 if(ax<tgt-err-2)ax+=aiSp;else if(ax>tgt+err+2)ax-=aiSp;
 ax=Math.max(ah,Math.min(W-ah,ax));
 if(by-R>H){lives--;beep(160,.35,'sawtooth');rally=0;
  if(lives<=0)return over();toast('พลาด! เหลือ '+lives+' ชีวิต');serve(1)}
 else if(by+R<0){score+=20;addCoin(8);rally=0;beep(1050,.18,'triangle');
  toast('🎯 ทำแต้มใส่ AI!');serve(-1)}
 draw();hud();raf=requestAnimationFrame(loop)}
function draw(){X.fillStyle='#02060f';X.fillRect(0,0,W,H);
 X.strokeStyle='rgba(163,230,53,.25)';X.setLineDash([9,11]);X.lineWidth=2;
 X.beginPath();X.moveTo(0,H/2);X.lineTo(W,H/2);X.stroke();X.setLineDash([]);
 X.fillStyle='#ef4444';const ah=apw()/2;
 X.fillRect(ax-ah,AY,apw(),PH);
 X.fillStyle='#a3e635';const half=pw()/2;
 X.fillRect(px-half,PY,pw(),PH);
 X.fillStyle=slow>0?'#22d3ee':'#fff';
 X.beginPath();X.arc(bx,by,R,0,7);X.fill();
 X.fillStyle='rgba(230,244,255,.5)';X.font='900 12px system-ui';X.textAlign='center';
 X.fillText('AI',W/2,H/2-12);X.fillText('YOU',W/2,H/2+22);
 if(serveT>0){X.fillStyle='#fbbf24';X.font='900 22px system-ui';
  X.fillText('เตรียมตัว!',W/2,H/2-40)}
 if(slow>0){X.fillStyle='#22d3ee';X.font='900 13px system-ui';X.textAlign='left';
  X.fillText('⏳ SLOW '+(slow/1000).toFixed(1)+'s',10,18)}}
function useSlow(){if(!alive)return;
 if((up.sw|0)<=0){beep(150,.2,'sawtooth');return toast('ไม่มีไอเทมสโลว์โม')}
 up.sw--;ST('up',up);slow=4000;beep(300,.3,'sine');toast('⏳ สโลว์โม 4 วินาที');hud()}
function over(){if(!alive)return;alive=false;cancelAnimationFrame(raf);
 beep(140,.45,'sawtooth');
 const nb=score>best;if(nb){best=score;ST('best',best)}
 $('os').textContent=score;
 $('ob').textContent=(nb?'🏆 สถิติใหม่! ':'สถิติสูงสุด ')+best;
 $('oc').textContent='ได้รับ +'+gain+' 🪙';save();show('over')}
function setX(cx){const r=cv.getBoundingClientRect();
 const half=pw()/2;
 px=Math.max(half,Math.min(W-half,(cx-r.left)*(W/r.width)))}
cv.addEventListener('touchstart',e=>{e.preventDefault();if(alive)setX(e.touches[0].clientX)},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(alive)setX(e.touches[0].clientX)},{passive:false});
cv.addEventListener('mousemove',e=>{if(alive)setX(e.clientX)});
addEventListener('keydown',e=>{if(!alive)return;const half=pw()/2;
 if(e.key=='ArrowLeft'){e.preventDefault();px=Math.max(half,px-28)}
 if(e.key=='ArrowRight'){e.preventDefault();px=Math.min(W-half,px+28)}});
function save(){ST('coin',coin);ST('up',up);ST('best',best)}
addEventListener('visibilitychange',()=>{if(document.hidden)save()});
addEventListener('beforeunload',save);
paint();
</script></body></html>
