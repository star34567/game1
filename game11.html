<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>⌨️ พิมพ์ดีดทะลุจอ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#030713;color:#e6f4ff;display:grid;place-items:center;min-height:100vh;padding:10px}
.app{width:100%;max-width:380px;background:#08142a;border:1px solid #16305a;border-radius:20px;padding:14px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.bar h1{flex:1;font-size:16px;color:#34d399}
.coin{background:#3a2c07;color:#fbbf24;border:1px solid #6b5210;padding:6px 12px;border-radius:99px;font-weight:800;font-size:14px}
.pg{display:none}.pg.on{display:block}
.card{background:#050f22;border:1px solid #16305a;border-radius:14px;padding:16px;text-align:center}
.big{font-size:30px;font-weight:900;color:#fbbf24}
.mut{font-size:12px;color:#8fa9c8;line-height:1.7}
button{border:0;cursor:pointer;font-family:inherit}
.btn{width:100%;padding:13px;border-radius:13px;font-size:15px;font-weight:800;color:#fff;background:#059669;margin-top:8px}
.btn.g{background:#16a34a}.btn.o{background:#d97706}.btn.d{background:#122a4a;color:#cbd5e1}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hud{display:flex;gap:6px;margin:10px 0}
.hud div{flex:1;background:#050f22;border:1px solid #16305a;border-radius:11px;padding:7px;text-align:center;font-size:10px;color:#8fa9c8}
.hud b{display:block;font-size:15px;color:#e6f4ff}
.item{display:flex;gap:10px;align-items:center;background:#050f22;border:1px solid #16305a;border-radius:13px;padding:10px;margin-bottom:8px}
.item .ic{font-size:22px}.item .tx{flex:1}.item b{font-size:13px}.item p{font-size:11px;color:#8fa9c8}
.item button{padding:9px 12px;border-radius:10px;background:#f59e0b;color:#2b1a00;font-weight:800;font-size:12px}
.item button:disabled{background:#122a4a;color:#5b7398}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0c2545;border:1px solid #1d4373;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
#wd{font-size:25px;font-weight:800;word-break:break-all;min-height:38px;line-height:1.3}
#wd .ok{color:#4ade80}#wd .bad{color:#f87171;text-decoration:underline}#wd .rs{color:#5b7398}
#inp{width:100%;padding:12px;border-radius:12px;border:1px solid #16305a;background:#050f22;color:#e6f4ff;font-size:17px;text-align:center;outline:none;margin-top:10px}
.tb{height:9px;background:#122a4a;border-radius:9px;overflow:hidden;margin-top:10px}
.tb i{display:block;height:100%;background:#34d399;width:100%;transition:width .1s linear}
</style></head><body>
<div class="app">
<div class="bar"><h1>⌨️ พิมพ์ดีดทะลุจอ</h1><div class="coin">🪙 <span id="cn">0</span></div></div>

<div id="menu" class="pg on">
 <div class="card"><div style="font-size:52px">⌨️</div><div class="big" id="bs">0</div>
 <div class="mut">คำสูงสุดที่เคยพิมพ์ได้</div></div>
 <p class="mut" style="margin-top:10px">พิมพ์ให้ตรงก่อนหมดเวลา · คำยิ่งยาวยิ่งได้เหรียญ<br>พิมพ์ถูกจะได้เวลาคืน ถ้าหมดเวลา = จบเกม</p>
 <div class="row"><button class="btn g" onclick="start('en')">🇬🇧 อังกฤษ</button>
 <button class="btn g" onclick="start('th')">🇹🇭 ไทย</button></div>
 <button class="btn o" onclick="openShop()">🛒 ร้านค้า</button>
</div>

<div id="shop" class="pg"><div id="ups"></div><button class="btn d" onclick="show('menu')">← กลับ</button></div>

<div id="game" class="pg">
 <div class="card"><div id="wd"></div></div>
 <input id="inp" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="พิมพ์ที่นี่...">
 <div class="tb"><i id="tbar"></i></div>
 <div class="hud"><div>คำ<b id="hs">0</b></div><div>เหรียญ<b id="hg">0</b></div>
 <div>คอมโบ<b id="hc">0</b></div><div>WPM<b id="hw">0</b></div></div>
 <button class="btn o" id="skb" onclick="useSkip()">⏭️ ข้ามคำ (0)</button>
 <button class="btn d" onclick="quit()">🏠 ออก</button>
</div>

<div id="over" class="pg">
 <div class="card"><div style="font-size:44px">⏰</div><div class="big" id="os">0</div>
 <div class="mut" id="ob"></div><div style="margin-top:8px;color:#fbbf24;font-weight:800" id="oc"></div></div>
 <button class="btn g" onclick="start(mode)">🔄 เล่นอีกครั้ง</button>
 <div class="row"><button class="btn o" onclick="openShop()">🛒 ร้านค้า</button>
 <button class="btn d" onclick="show('menu')">🏠 เมนู</button></div>
</div>
</div><div class="toast" id="tst"></div>
<script>
const K='typ_',$=i=>document.getElementById(i);
const LD=(k,d)=>{try{const v=localStorage.getItem(K+k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const ST=(k,v)=>{try{localStorage.setItem(K+k,JSON.stringify(v))}catch(e){}};
let coin=LD('coin',0),up=LD('up',{tm:0,bn:0,mu:0,sk:0}),best=LD('best',0);
let AC;function beep(f,d,t,v){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
 if(AC.state=='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();
 o.type=t||'square';o.frequency.value=f;g.gain.setValueAtTime(v||.08,AC.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
 o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function paint(){$('cn').textContent=coin;$('bs').textContent=best;
 document.querySelectorAll('[data-c]').forEach(b=>b.disabled=coin<+b.dataset.c)}
function toast(m){const t=$('tst');t.textContent=m;t.classList.add('on');
 clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('on'),1400)}
function show(id){document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));$(id).classList.add('on');paint()}
const UPS=[{k:'tm',i:'⏱️',n:'เวลาเริ่มต้น',d:'+3 วินาทีต่อระดับ',max:4,c:l=>120+l*130},
{k:'bn',i:'🎯',n:'โบนัสต่อคำ',d:'+0.35 วิ เมื่อพิมพ์ถูก',max:4,c:l=>140+l*150},
{k:'mu',i:'💰',n:'ตัวคูณเหรียญ',d:'รับเหรียญ +25% ต่อระดับ',max:4,c:l=>150+l*140},
{k:'sk',i:'⏭️',n:'ตั๋วข้ามคำ',d:'ข้ามคำที่พิมพ์ไม่ไหว (ใช้แล้วหมด)',a:1,c:()=>70}];
function openShop(){show('shop');renderShop()}
function renderShop(){const b=$('ups');b.innerHTML='';
 UPS.forEach(o=>{const l=up[o.k]|0,mx=!o.a&&l>=o.max,c=o.c(l);
  const d=document.createElement('div');d.className='item';
  d.innerHTML='<div class="ic">'+o.i+'</div><div class="tx"><b>'+o.n+
   ' <span style="color:#fbbf24">'+(o.a?'x'+l:'Lv'+l+'/'+o.max)+'</span></b><p>'+o.d+'</p></div>';
  const t=document.createElement('button');t.textContent=mx?'MAX':'🪙 '+c;
  if(mx)t.disabled=true;else{t.dataset.c=c;t.onclick=()=>{
   if(coin<c){beep(150,.2,'sawtooth');return toast('เหรียญไม่พอ')}
   coin-=c;up[o.k]=l+1;ST('coin',coin);ST('up',up);beep(900,.12,'triangle');
   toast(o.a?'ซื้อแล้ว!':'อัปเป็น Lv'+(l+1));renderShop()}}
  d.appendChild(t);b.appendChild(d)});paint()}
function addCoin(n){n=Math.round(n*(1+up.mu*.25));if(n<=0)return;coin+=n;gain+=n;ST('coin',coin);paint()}

const BANK={en:['cat','dog','sun','map','fox','code','ship','pixel','robot','ocean','tiger','cloud','rocket','garden','future','system','random','battle','planet','danger','output','wizard','oxygen','puzzle','victory','machine','network','diamond','journey','gravity','captain','harmony','library','monster','quantum','thunder','adventure','knowledge','lightning','impossible'],
th:['แมว','ดาว','ฝน','ต้นไม้','ดนตรี','ความสุข','หนังสือ','ขนมปัง','จักรยาน','ผีเสื้อ','นักเรียน','โทรศัพท์','ทะเลสาบ','ภูเขาไฟ','รถไฟฟ้า','โรงเรียน','กาแฟเย็น','เพื่อนรัก','ฝนตกหนัก','ประเทศไทย','ดวงอาทิตย์','คอมพิวเตอร์','ความทรงจำ','ปลาทองสีแดง','แสงแดดยามเช้า']};
for(const k in BANK)BANK[k].sort((a,b)=>a.length-b.length);
let mode='en',word='',typed='',tleft=0,tmax=0,score=0,combo=0,gain=0,chars=0,t0=0,tick=null,alive=false;
const inp=$('inp');
function start(m){mode=m||'en';beep(600,.1,'triangle');
 tmax=13+up.tm*3;tleft=tmax;score=0;combo=0;gain=0;chars=0;t0=Date.now();alive=true;
 show('game');nextWord();inp.value='';setTimeout(()=>inp.focus(),80);
 clearInterval(tick);tick=setInterval(step,100);hud()}
function quit(){alive=false;clearInterval(tick);save();show('menu')}
function nextWord(){const p=BANK[mode];
 const mx=Math.min(p.length,9+Math.floor(score/3)*4);
 let w;do{w=p[Math.random()*mx|0]}while(w==word&&mx>1);
 word=w;typed='';inp.value='';render()}
function esc(c){return c==' '?'&nbsp;':c.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(){let h='';
 for(let i=0;i<word.length;i++){const c=word[i];
  h+= i<typed.length ? '<span class="'+(typed[i]==c?'ok':'bad')+'">'+esc(c)+'</span>'
                     : '<span class="rs">'+esc(c)+'</span>'}
 $('wd').innerHTML=h}
function hud(){$('hs').textContent=score;$('hg').textContent=gain;$('hc').textContent=combo+'x';
 const m=(Date.now()-t0)/60000;$('hw').textContent=m>0?Math.round(chars/5/m):0;
 $('tbar').style.width=Math.max(0,tleft/tmax*100)+'%';
 $('skb').textContent='⏭️ ข้ามคำ ('+(up.sk|0)+')'}
function step(){if(!alive)return;tleft-=.1;if(tleft<=0){tleft=0;return over()}hud()}
inp.addEventListener('input',()=>{if(!alive)return;
 typed=inp.value;render();
 if(typed===word){chars+=word.length;score++;combo++;
  const rw=Math.max(1,Math.round(word.length/2.5))+Math.floor(combo/5);
  addCoin(rw);beep(950,.07,'triangle');
  tleft=Math.min(tmax,tleft+1.2+up.bn*.35);nextWord();hud()}
 else if(!word.startsWith(typed)){if(combo>0){combo=0;beep(200,.08,'sawtooth')}hud()}});
function useSkip(){if(!alive)return;
 if((up.sk|0)<=0){beep(150,.2,'sawtooth');return toast('ไม่มีตั๋วข้ามคำ')}
 up.sk--;ST('up',up);beep(700,.1,'triangle');toast('ข้ามคำแล้ว');nextWord();hud()}
function over(){if(!alive)return;alive=false;clearInterval(tick);inp.blur();
 beep(140,.45,'sawtooth');
 const nb=score>best;if(nb){best=score;ST('best',best)}
 $('os').textContent=score+' คำ';
 $('ob').textContent=(nb?'🏆 สถิติใหม่! ':'สถิติสูงสุด ')+best+' คำ';
 $('oc').textContent='ได้รับ +'+gain+' 🪙';save();show('over')}
function save(){ST('coin',coin);ST('up',up);ST('best',best)}
addEventListener('visibilitychange',()=>{if(document.hidden)save()});
addEventListener('beforeunload',save);
paint();
</script></body></html>
