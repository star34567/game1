<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>🔨 ตีตัวตุ่น</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#140a02;color:#fff4e6;display:grid;place-items:center;min-height:100vh;padding:10px}
.app{width:100%;max-width:380px;background:#24140a;border:1px solid #4d2f12;border-radius:20px;padding:14px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.bar h1{flex:1;font-size:16px;color:#fbbf24}
.coin{background:#3a2c07;color:#fbbf24;border:1px solid #6b5210;padding:6px 12px;border-radius:99px;font-weight:800;font-size:14px}
.pg{display:none}.pg.on{display:block}
.card{background:#1a0e05;border:1px solid #4d2f12;border-radius:14px;padding:16px;text-align:center}
.big{font-size:30px;font-weight:900;color:#fbbf24}
.mut{font-size:12px;color:#c4a98a;line-height:1.7}
button{border:0;cursor:pointer;font-family:inherit}
.btn{width:100%;padding:13px;border-radius:13px;font-size:15px;font-weight:800;color:#fff;background:#ea580c;margin-top:8px}
.btn.g{background:#16a34a}.btn.o{background:#d97706}.btn.d{background:#3a2210;color:#e8d9c6}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hud{display:flex;gap:6px;margin:10px 0}
.hud div{flex:1;background:#1a0e05;border:1px solid #4d2f12;border-radius:11px;padding:7px;text-align:center;font-size:10px;color:#c4a98a}
.hud b{display:block;font-size:15px;color:#fff4e6}
.tb{height:9px;background:#1a0e05;border:1px solid #4d2f12;border-radius:99px;overflow:hidden;margin-bottom:10px}
.tb i{display:block;height:100%;background:linear-gradient(90deg,#ea580c,#fbbf24);transition:width .25s linear}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.hole{aspect-ratio:1;border-radius:50%;background:radial-gradient(ellipse at 50% 34%,#2e1607,#0a0502);
border:3px solid #4d2f12;display:grid;place-items:center;overflow:hidden;cursor:pointer;position:relative}
.hole:active{transform:scale(.95)}
.hole span{font-size:34px;transform:translateY(72px);transition:transform .12s;display:block}
.hole.up span{transform:translateY(0)}
.fx{position:absolute;font-size:14px;font-weight:900;pointer-events:none;animation:up .7s forwards}
@keyframes up{to{transform:translateY(-40px);opacity:0}}
.item{display:flex;gap:10px;align-items:center;background:#1a0e05;border:1px solid #4d2f12;border-radius:13px;padding:10px;margin-bottom:8px}
.item .ic{font-size:22px}.item .tx{flex:1}.item b{font-size:13px}.item p{font-size:11px;color:#c4a98a}
.item button{padding:9px 12px;border-radius:10px;background:#fbbf24;color:#2b1a00;font-weight:800;font-size:12px}
.item button:disabled{background:#3a2210;color:#7a624a}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#33200e;border:1px solid #5f3b18;padding:10px 18px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
</style></head><body>
<div class="app">
<div class="bar"><h1>🔨 ตีตัวตุ่น</h1><div class="coin">🪙 <span id="cn">0</span></div></div>

<div id="menu" class="pg on">
 <div class="card"><div style="font-size:52px">🐹</div><div class="big" id="bs">0</div>
 <div class="mut">คะแนนสูงสุด</div></div>
 <p class="mut" style="margin-top:10px">🐹 +10 &amp; 1🪙 · 🐰 +25 &amp; 2🪙 · 👑 +80 &amp; 8🪙<br>
 ⏱️ นาฬิกา +4 วิ · 💣 <b style="color:#f87171">ห้ามตี!</b> · ตีติดกันได้คอมโบ</p>
 <button class="btn g" onclick="start()">▶ เริ่มเล่น</button>
 <button class="btn o" onclick="openShop()">🛒 ร้านค้า</button>
</div>

<div id="shop" class="pg"><div id="ups"></div>
 <button class="btn d" onclick="show('menu')">← กลับ</button></div>

<div id="game" class="pg">
 <div class="hud"><div>คะแนน<b id="hs">0</b></div><div>คอมโบ<b id="hc">x1</b></div>
 <div>เหรียญ<b id="hg">0</b></div><div>พลาด<b id="hm">0/5</b></div></div>
 <div class="tb"><i id="tf" style="width:100%"></i></div>
 <div class="grid" id="grid"></div>
 <button class="btn d" onclick="quit()">🏠 ออก</button>
</div>

<div id="over" class="pg">
 <div class="card"><div style="font-size:44px" id="oe">🐹</div><div class="big" id="os">0</div>
 <div class="mut" id="ob"></div><div style="margin-top:8px;color:#fbbf24;font-weight:800" id="oc"></div></div>
 <button class="btn g" onclick="start()">🔄 เล่นอีกครั้ง</button>
 <div class="row"><button class="btn o" onclick="openShop()">🛒 ร้านค้า</button>
 <button class="btn d" onclick="show('menu')">🏠 เมนู</button></div>
</div>
</div><div class="toast" id="tst"></div>
<script>
const K='mol_',$=i=>document.getElementById(i);
const LD=(k,d)=>{try{const v=localStorage.getItem(K+k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const ST=(k,v)=>{try{localStorage.setItem(K+k,JSON.stringify(v))}catch(e){}};
let coin=LD('coin',0),up=LD('up',{tm:0,pw:0,lk:0,mu:0}),best=LD('best',0);
let AC;function beep(f,d,t){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
 if(AC.state=='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();
 o.type=t||'square';o.frequency.value=f;g.gain.setValueAtTime(.1,AC.currentTime);
 g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
 o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function paint(){$('cn').textContent=coin;$('bs').textContent=best;
 document.querySelectorAll('[data-c]').forEach(b=>b.disabled=coin<+b.dataset.c)}
function toast(m){const t=$('tst');t.textContent=m;t.classList.add('on');
 clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('on'),1400)}
function show(id){document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));$(id).classList.add('on');paint()}
const UPS=[{k:'tm',i:'⏱️',n:'เวลาเริ่มต้น',d:'+6 วินาทีต่อระดับ',max:4,c:l=>100+l*100},
{k:'pw',i:'💪',n:'พลังค้อน',d:'คะแนน +15% ต่อระดับ',max:4,c:l=>140+l*145},
{k:'lk',i:'👑',n:'โชคตัวทอง',d:'ตัวทองโผล่บ่อยขึ้น',max:3,c:l=>180+l*190},
{k:'mu',i:'💰',n:'ตัวคูณเหรียญ',d:'รับเหรียญ +25% ต่อระดับ',max:4,c:l=>150+l*140}];
function openShop(){show('shop');renderShop()}
function renderShop(){const b=$('ups');b.innerHTML='';
 UPS.forEach(o=>{const l=up[o.k]|0,mx=l>=o.max,c=o.c(l);
  const d=document.createElement('div');d.className='item';
  d.innerHTML='<div class="ic">'+o.i+'</div><div class="tx"><b>'+o.n+
   ' <span style="color:#fbbf24">Lv'+l+'/'+o.max+'</span></b><p>'+o.d+'</p></div>';
  const t=document.createElement('button');t.textContent=mx?'MAX':'🪙 '+c;
  if(mx)t.disabled=true;else{t.dataset.c=c;t.onclick=()=>{
   if(coin<c){beep(150,.2,'sawtooth');return toast('เหรียญไม่พอ')}
   coin-=c;up[o.k]=l+1;ST('coin',coin);ST('up',up);beep(900,.12,'triangle');renderShop()}}
  d.appendChild(t);b.appendChild(d)});paint()}

const holes=[];
for(let i=0;i<9;i++){const d=document.createElement('div');d.className='hole';
 d.innerHTML='<span></span>';d.onclick=()=>whack(i);$('grid').appendChild(d);holes.push(d)}
let cells,score,gain=0,combo,miss,maxMiss,time,maxTime,hits,level,eng,tmr,running=false;
function addCoin(n){if(n<=0)return;coin+=n;gain+=n;ST('coin',coin);paint()}
function start(){beep(600,.1,'triangle');
 cells=[...Array(9)].map(()=>({t:null,tm:0}));
 score=0;gain=0;combo=0;miss=0;hits=0;level=1;
 maxMiss=5;maxTime=time=45+up.tm*6;running=true;
 holes.forEach(h=>{h.classList.remove('up');h.querySelector('span').textContent=''});
 show('game');hud();
 clearInterval(eng);clearInterval(tmr);
 eng=setInterval(tick,120);
 tmr=setInterval(()=>{if(!running)return;time-=.25;
  $('tf').style.width=Math.max(0,time/maxTime*100)+'%';
  if(time<=0)end('⏰ หมดเวลา!')},250)}
function quit(){running=false;clearInterval(eng);clearInterval(tmr);show('menu')}
function hud(){$('hs').textContent=score;$('hc').textContent='x'+Math.max(1,combo);
 $('hg').textContent=gain;$('hm').textContent=miss+'/'+maxMiss}
function pick(){const r=Math.random();
 if(r<.05+up.lk*.03)return{e:'👑',v:80,c:8,life:900};
 if(r<.13)return{e:'⏱️',v:0,c:0,life:1200};
 if(r<.25)return{e:'💣',v:0,c:0,life:1300};
 if(r<.50)return{e:'🐰',v:25,c:2,life:Math.max(520,900-level*25)};
 return{e:'🐹',v:10,c:1,life:Math.max(650,1200-level*35)}}
function tick(){if(!running)return;
 level=Math.min(12,1+(hits/7|0));
 cells.forEach((c,i)=>{if(c.t){c.tm-=120;
  if(c.tm<=0){if(c.t.v>0){combo=0;miss++;hud();
    if(miss>=maxMiss){end('💥 พลาดเกินกำหนด!');return}}
   c.t=null;holes[i].classList.remove('up');holes[i].querySelector('span').textContent=''}}});
 const act=cells.filter(c=>c.t).length,want=Math.min(4,1+(level/3|0));
 if(act<want&&Math.random()<.6){
  const free=cells.map((c,i)=>c.t?null:i).filter(v=>v!==null);
  if(free.length){const i=free[Math.random()*free.length|0],t=pick();
   cells[i]={t,tm:t.life};
   holes[i].querySelector('span').textContent=t.e;holes[i].classList.add('up')}}}
function fx(i,txt,col){const s=document.createElement('div');s.className='fx';
 s.textContent=txt;s.style.color=col;holes[i].appendChild(s);setTimeout(()=>s.remove(),700)}
function whack(i){if(!running)return;const c=cells[i];
 if(!c.t){combo=0;miss++;fx(i,'พลาด','#f87171');beep(180,.1,'sawtooth');hud();
  if(miss>=maxMiss)end('💥 พลาดเกินกำหนด!');return}
 const t=c.t;c.t=null;holes[i].classList.remove('up');holes[i].querySelector('span').textContent='';
 if(t.e=='💣'){combo=0;miss+=2;time=Math.max(0,time-3);
  fx(i,'💥 -3วิ','#f87171');beep(100,.35,'sawtooth');hud();
  if(miss>=maxMiss)end('💣 โดนระเบิด!');return}
 if(t.e=='⏱️'){time=Math.min(maxTime,time+4);fx(i,'+4 วิ','#38bdf8');
  beep(1200,.15,'sine');hud();return}
 hits++;combo=Math.min(10,combo+1);
 const gainPt=Math.round(t.v*Math.max(1,combo)*(1+up.pw*.15));
 score+=gainPt;addCoin(Math.round(t.c*(1+up.mu*.25)));
 fx(i,'+'+gainPt,t.e=='👑'?'#fde047':'#a7f3d0');
 beep(t.e=='👑'?1200:500+combo*60,.09,'triangle');hud()}
function end(msg){running=false;clearInterval(eng);clearInterval(tmr);
 holes.forEach(h=>{h.classList.remove('up');h.querySelector('span').textContent=''});
 beep(160,.4,'sawtooth');
 addCoin(Math.round(score/60*(1+up.mu*.25)));
 const nb=score>best;if(nb){best=score;ST('best',best)}
 $('oe').textContent=nb?'🏆':'🐹';$('os').textContent=score;
 $('ob').textContent=msg+' · ตีโดน '+hits+' ครั้ง · สถิติ '+best;
 $('oc').textContent='ได้รับ +'+gain+' 🪙';show('over')}
paint();
</script></body></html>
